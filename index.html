
<script>
/* ŞEHZADE MEDIA - OTOMATİK TAM EKRAN */

function sehzadeAutoFullscreen() {
  const video = document.getElementById("video");
  const player = document.getElementById("player");

  if (!video || !player) return;

  // Önce video için gerçek tam ekranı dene
  try {
    if (video.requestFullscreen) {
      const result = video.requestFullscreen();
      if (result && result.catch) {
        result.catch(() => {
          player.classList.add("sehzade-fullscreen");
        });
      }
      return;
    }

    if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
      return;
    }
  } catch (e) {}

  // Tarayıcı engellerse uygulama içi tam ekran
  player.classList.add("sehzade-fullscreen");
}

(function () {
  const originalOpenItem = window.openItem;

  window.openItem = function (item) {
    if (!item) return;

    const isTV = typeof TV !== "undefined" &&
      TV.some(channel => channel[0] === item[0]);

    const isRadio = typeof RADIO !== "undefined" &&
      RADIO.some(channel => channel[0] === item[0]);

    if (!isTV && !isRadio) {
      return originalOpenItem(item);
    }

    // Kanal seçimi sırasında tam ekranı başlat
    const result = originalOpenItem(item);
    sehzadeAutoFullscreen();
    return result;
  };

  const originalClosePlayer = window.closePlayer;

  window.closePlayer = function () {
    const player = document.getElementById("player");
    if (player) {
      player.classList.remove("sehzade-fullscreen");
    }

    if (document.fullscreenElement &&
        document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }

    return originalClosePlayer();
  };
})();
</script>

<style>
#player.sehzade-fullscreen {
  display:block!important;
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100dvh!important;
  z-index:99999!important;
  background:#000!important;
}

#player.sehzade-fullscreen #video {
  width:100%!important;
  height:calc(100dvh - 125px)!important;
  max-height:none!important;
  object-fit:contain;
}
</style>
