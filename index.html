<style>
:root{--accent:#59a9ff;--gold:#e8bd7e;--bg:#050b16}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#f5f7fc;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{padding:25px 4%;min-height:135px;background:linear-gradient(120deg,#071323,#152a46 60%,#071323);border-bottom:1px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font-size:clamp(24px,4vw,44px);font-weight:900;letter-spacing:2px;color:var(--gold)}
.brand span{color:white}
.tag{font-size:11px;letter-spacing:2px;color:#a8bdd6;margin-top:10px}
.info{display:flex;align-items:center;gap:18px}
#clock{font-size:clamp(22px,3vw,38px);font-weight:800}
#date{font-size:12px;color:#b6c7dc}
.weather{border-left:1px solid #60718b;padding-left:15px;font-size:12px;line-height:1.8}
.weather b{font-size:22px;color:var(--gold)}
main{padding:20px 4% 35px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:13px}
nav button{flex:none;background:#15263e;color:white;border:1px solid #405775;border-radius:11px;padding:12px 16px;font-weight:bold}
nav button.active{background:var(--gold);color:#101925}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 20px;flex-wrap:wrap}
h2{font-size:23px;margin:0}
#search{background:#15263e;color:white;border:1px solid #536a87;border-radius:11px;padding:12px;width:min(330px,100%)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:13px}
.tile{position:relative;min-height:135px;background:linear-gradient(135deg,#1c304a,#0d192c);border:1px solid #3e526d;border-radius:15px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:13px}
.tile:hover,.tile.selected{border-color:var(--gold);background:#293e5b}
.tile .emoji{font-size:36px}
.tile strong{text-align:center}
.star{position:absolute;right:10px;top:6px;font-size:24px;color:var(--gold)}
footer{padding:16px 4%;border-top:1px solid #283c57;color:#9fb4cd;font-size:12px;display:flex;justify-content:space-between;gap:10px}
footer button{background:#233850;color:white;border:1px solid #536781;border-radius:9px;padding:9px}
.player{position:fixed;inset:0;z-index:1000;background:#010307;display:none;flex-direction:column}
.player.open{display:flex}
.player-top{background:#0b1729;display:flex;align-items:center;justify-content:space-between;padding:11px 17px;gap:10px}
.player-top button,.controls button,.radio-controls button{background:#223750;border:1px solid #526780;border-radius:10px;color:white;padding:10px 13px;font-weight:bold}
.video-area{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
#video{width:100%;height:100%;object-fit:contain}
.player-bottom{background:#07111f;padding:9px 12px 13px}
#message{text-align:center;font-size:12px;color:#b9c9dc;min-height:18px;margin-bottom:9px}
.controls,.radio-controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.controls .gold{background:#866138}
.radio-controls{display:none;margin-bottom:10px}
.radio-controls select{background:#142740;color:white;border:1px solid var(--gold);border-radius:9px;padding:9px}

/* DIGITAL COCKPIT V2 */
.radio-display{position:absolute;inset:0;display:none;overflow:hidden;isolation:isolate}
.player.radio-mode #video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.player.radio-mode .radio-display{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 55%,#1c3859,#0a172b 46%,#02050c 90%)}
.player.radio-mode .radio-controls{display:flex}
.player.radio-mode .player-top,.player.radio-mode .player-bottom{background:#050c18}
.lux-head{position:absolute;top:20px;left:24px;z-index:9}
.lux-head b{display:block;color:var(--gold);font-size:17px;letter-spacing:4px}
.lux-head small{display:block;color:#b2c7e1;font-size:10px;letter-spacing:3px;margin-top:6px}
.lux-live{position:absolute;right:24px;top:23px;color:#edca91;font-size:12px;letter-spacing:2px;z-index:9}
.lux-stage{position:relative;z-index:5;display:flex;align-items:center;justify-content:center;gap:20px;width:100%}
.lux-side{display:flex;align-items:center;gap:10px}
.lux-card{width:clamp(70px,10vw,135px);height:clamp(90px,13vw,150px);background:linear-gradient(135deg,#2a4664c9,#081224dd);border:1px solid #8baecb;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:clamp(10px,1.3vw,16px);font-weight:bold;cursor:pointer;box-shadow:0 0 20px #448bdb33;transition:transform .3s,border-color .3s}
.lux-card:hover{transform:scale(1.08);border-color:var(--gold)}
.lux-card.far{opacity:.55;transform:scale(.84)}
.lux-center{position:relative;flex:none;width:clamp(165px,25vw,275px);height:clamp(165px,25vw,275px);display:flex;align-items:center;justify-content:center}
.lux-ring{position:absolute;inset:-8px;border:1px solid var(--gold);border-radius:50%;box-shadow:0 0 22px #e4b97888;animation:ringPulse 4s ease-in-out infinite}
.lux-ring.second{inset:-22px;border-color:var(--accent);box-shadow:0 0 27px var(--accent);animation:ringPulse 4s ease-in-out infinite,ringRotate 13s linear infinite}
.lux-ring.second:before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;background:var(--accent);border-radius:50%;box-shadow:0 0 15px var(--accent)}
.lux-orb{position:relative;z-index:2;width:90%;height:90%;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 30% 20%,#354f70,#122139 50%,#02060e 95%);box-shadow:0 0 28px #e4b97877,0 0 65px var(--accent),inset 0 0 30px #89bfff33;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:17px;text-align:center;animation:orbPulse 3.5s ease-in-out infinite alternate}
.lux-orb.switching{animation:stationExit .28s ease-in both}
.lux-orb.arriving{animation:stationEnter .55s cubic-bezier(.2,.8,.2,1) both}
#luxLogo{font-size:clamp(18px,3vw,35px);font-weight:900;overflow-wrap:anywhere;text-shadow:0 0 16px #70b9ff}
#luxName{font-size:clamp(13px,1.6vw,19px)}
.lux-orb small{font-size:9px;letter-spacing:2px;color:#b8c9df}
#luxStationImage{max-width:70%;max-height:40%;object-fit:contain;filter:drop-shadow(0 0 12px #ffffff77)}
#luxStationImage[hidden]{display:none}
#luxStationImage:not([hidden])+#luxLogo{display:none}
.lux-wave{position:absolute;left:-15%;top:50%;width:130%;height:115px;border-radius:50%;pointer-events:none;z-index:1}
.wave1{border-top:3px solid var(--accent);border-bottom:2px solid var(--accent);box-shadow:0 0 23px var(--accent);animation:waveFlow 4s ease-in-out infinite alternate}
.wave2{border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);box-shadow:0 0 25px var(--gold);animation:waveFlow 5s ease-in-out infinite alternate-reverse}
.wave3{border-top:1px solid #b4d9ff;border-bottom:1px solid var(--accent);opacity:.6;animation:waveFlow 6s ease-in-out infinite alternate}
.lux-eq{position:absolute;bottom:35px;left:15%;width:70%;height:42px;z-index:4;display:flex;align-items:center;justify-content:center;gap:4px}
.lux-eq span{flex:1;max-width:7px;height:8px;border-radius:4px;background:linear-gradient(to top,var(--accent),#d6ecff,var(--gold));box-shadow:0 0 8px var(--accent);animation:barPulse 1s ease-in-out infinite alternate}
.lux-foot{position:absolute;bottom:10px;font-size:10px;letter-spacing:4px;color:#9db3cc;z-index:5}
.ambient-palette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;width:min(400px,95vw);padding:10px;margin:0 auto 10px;background:#101e31;border:1px solid var(--gold);border-radius:12px}
.ambient-palette[hidden]{display:none}
.ambient-swatch{width:100%;aspect-ratio:1;border-radius:8px;border:2px solid #ffffff55;padding:0;min-width:20px}
.ambient-swatch.active{border:3px solid white;box-shadow:0 0 12px currentColor}
@keyframes ringPulse{0%,100%{opacity:.4;scale:.98}50%{opacity:1;scale:1.04}}
@keyframes ringRotate{to{transform:rotate(360deg)}}
@keyframes orbPulse{from{transform:scale(.98)}to{transform:scale(1.025)}}
@keyframes waveFlow{from{transform:translateY(-65%) rotate(-7deg) scaleY(.7)}to{transform:translateY(-35%) rotate(7deg) scaleY(1.5)}}
@keyframes barPulse{from{height:5px;opacity:.4}to{height:38px;opacity:1}}
@keyframes stationExit{to{transform:scale(.7) rotate(-8deg);opacity:.1;filter:blur(8px)}}
@keyframes stationEnter{from{transform:scale(.7) rotate(8deg);opacity:.1;filter:blur(8px)}to{transform:scale(1);opacity:1;filter:blur(0)}}
@media(max-width:800px){
header{padding:15px;min-height:115px}.brand{font-size:25px}.tag{font-size:9px}
.info{gap:8px}#clock{font-size:23px}.weather{font-size:10px}.weather b{font-size:17px}
main{padding:15px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:110px}.tile .emoji{font-size:30px}.tile strong{font-size:13px}
.player-top{padding:8px}.controls{gap:5px}.controls button{font-size:11px;padding:8px}
.lux-head{top:9px;left:10px}.lux-head b{font-size:11px;letter-spacing:2px}.lux-head small{font-size:8px;letter-spacing:1px}
.lux-live{top:11px;right:10px;font-size:9px;letter-spacing:0}
.lux-stage{gap:6px}.lux-side{gap:4px}.lux-center{width:145px;height:145px}
.lux-card{width:65px;height:85px;font-size:10px;padding:5px}
.lux-eq{bottom:20px;height:20px}.lux-foot{bottom:4px;font-size:8px}
}
@media(max-width:600px){
.lux-side .far{display:none}.lux-center{width:125px;height:125px}
.lux-card{width:58px;height:65px;font-size:9px}.lux-orb small{display:none}
.lux-head small{display:none}
}
@media(prefers-reduced-motion:reduce){.lux-ring,.lux-orb,.lux-wave,.lux-eq span{animation:none}}
</style>
</head>

function items(){
 if(page===0)return TV;
 if(page>=1&&page<=6)return TV.filter(x=>x[2]===MENU[page][0]);
 if(page===7)return RADIO;
 if(page===8)return [...TV.filter(x=>favorites.includes(x[0])),...RADIO.filter(x=>favorites.includes(x[0]))];
 return [['YouTube Ana Sayfa','▶️'],['Eskişehirspor','⚽'],['Türkçe Müzik','🎵'],['Belgesel','🌍'],['Çocuk Şarkıları','🧸']];
}
function render(){
 $('nav').replaceChildren();
 MENU.forEach((m,i)=>{
  const b=document.createElement('button');
  b.textContent=m[1]+' '+m[0];
  b.className=i===page?'active':'';
  b.onclick=()=>go(i);
  b.dataset.focus='1';
  $('nav').appendChild(b);
 });
 $('heading').textContent=MENU[page][1]+' '+MENU[page][0];
 $('cards').replaceChildren();
 const q=$('search').value.toLocaleLowerCase('tr-TR');
 const data=items().filter(x=>x[0].toLocaleLowerCase('tr-TR').includes(q));
 data.forEach(item=>{
  const b=document.createElement('button');
  b.className='tile';b.dataset.focus='1';
  const icon=document.createElement('span');
  icon.className='emoji';icon.textContent=item[1];
  const name=document.createElement('strong');
  name.textContent=item[0];
  b.append(icon,name);
  b.onclick=()=>openItem(item);
  if(page!==9){
   const star=document.createElement('span');
   star.className='star';
   star.textContent=favorites.includes(item[0])?'★':'☆';
   star.onclick=e=>{e.stopPropagation();toggleFavorite(item[0])};
   b.appendChild(star);
  }
  $('cards').appendChild(b);
 });
 if(!data.length){
  const p=document.createElement('p');
  p.textContent='Sonuç bulunamadı.';
  $('cards').appendChild(p);
 }
 refreshFocus();
}
function refreshFocus(){
 focusList=[...document.querySelectorAll('#nav [data-focus],#cards [data-focus],footer button')];
 selected=Math.max(0,Math.min(selected,focusList.length-1));
 focusList.forEach(x=>x.classList.remove('selected'));
 if(focusList[selected])focusList[selected].classList.add('selected');
}
function go(i){
 if($('player').classList.contains('open'))closePlayer();
 page=i;selected=0;$('search').value='';render();
 status(MENU[i][0]+' açıldı');
}
function openItem(item){
 if(page===9){
  const url=item[0]==='YouTube Ana Sayfa'?'https://m.youtube.com/':'https://m.youtube.com/results?search_query='+encodeURIComponent(item[0]);
  window.open(url,'_blank');return;
 }
 const ti=TV.findIndex(x=>x[0]===item[0]);
 if(ti>=0){activeRadio=false;activeIndex=ti}
 else{
  const ri=RADIO.findIndex(x=>x[0]===item[0]);
  if(ri<0)return;
  activeRadio=true;activeIndex=ri;
 }
 $('player').classList.add('open');
 loadChannel();
}

/* 64 RENKLİ AMBİYANS */
const ambient64=Array.from({length:64},(_,i)=>'hsl('+Math.round(i*360/64)+' 85% 65%)');
const ambientColors=['#59a9ff','#aa75ff','#edb96f','#ff526f','#42d7b1','#f5f5f5'];

function buildPalette(){
 const p=$('ambientPalette');
 p.replaceChildren();
 ambient64.forEach((color,i)=>{
  const b=document.createElement('button');
  b.type='button';b.className='ambient-swatch';
  b.style.background=color;
  b.title='Renk '+(i+1);
  b.setAttribute('aria-label','Ambiyans rengi '+(i+1));
  b.onclick=()=>{setAmbient(color);p.hidden=true};
  p.appendChild(b);
 });
}
function togglePalette(){
 $('ambientPalette').hidden=!$('ambientPalette').hidden;
}
function setAmbient(color){
 if(!ambient64.includes(color)&&!ambientColors.includes(color))return;
 document.documentElement.style.setProperty('--accent',color);
 $('ambientSelect').value=ambientColors.includes(color)?color:'#59a9ff';
 document.querySelectorAll('.ambient-swatch').forEach((b,i)=>{
  b.classList.toggle('active',ambient64[i]===color);
 });
 try{localStorage.setItem('sehzade_ambient',color)}catch(e){}
}
buildPalette();
try{setAmbient(localStorage.getItem('sehzade_ambient')||'#59a9ff')}
catch(e){setAmbient('#59a9ff')}

/* RADYO LOGOLARI VE ANİMASYONLARI */
const RADIO_MARKS={
 'TRT FM':'TRT FM','TRT Radyo 1':'TRT 1',
 'PowerTürk':'POWER TÜRK','Metro FM':'METRO FM',
 'JoyTürk':'JOY TÜRK','Kral Pop':'KRAL POP',
 'SlowTürk':'SLOW TÜRK','Radyo 7':'RADYO 7'
};
const LOGO_HOSTS={
 'TRT FM':'trt.net.tr',
 'TRT Radyo 1':'trt.net.tr',
 'PowerTürk':'powerapp.com.tr',
 'Metro FM':'karnaval.com',
 'JoyTürk':'karnaval.com',
 'Kral Pop':'kralmuzik.com.tr',
 'SlowTürk':'slowturk.com.tr',
 'Radyo 7':'radyo7.com'
};
let stationTimer=null,logoRequest=0;

function showStationLogo(name){
 const img=$('luxStationImage');
 const token=++logoRequest;
 img.hidden=true;img.removeAttribute('src');
 const host=LOGO_HOSTS[name];
 if(!host)return;
 const url='https://www.google.com/s2/favicons?domain='+encodeURIComponent(host)+'&sz=128';
 const probe=new Image();
 probe.onload=()=>{
  if(token!==logoRequest||probe.naturalWidth<32)return;
  img.src=url;img.hidden=false;
 };
 probe.onerror=()=>{if(token===logoRequest)img.hidden=true};
 probe.src=url;
}
function updateRadioCockpit(){
 const n=RADIO.length,i=activeIndex,name=RADIO[i][0];
 const orb=document.querySelector('.lux-orb');
 clearTimeout(stationTimer);
 orb.classList.remove('switching','arriving');
 void orb.offsetWidth;
 orb.classList.add('switching');

 stationTimer=setTimeout(()=>{
  $('luxLogo').textContent=RADIO_MARKS[name]||name;
  $('luxName').textContent=name;
  showStationLogo(name);
  $('luxPrev').textContent=RADIO[(i-1+n)%n][0];
  $('luxPrev2').textContent=RADIO[(i-2+n)%n][0];
  $('luxNext').textContent=RADIO[(i+1)%n][0];
  $('luxNext2').textContent=RADIO[(i+2)%n][0];
  orb.classList.remove('switching');
  void orb.offsetWidth;
  orb.classList.add('arriving');
 },280);

 const eq=$('luxEqualizer');
 if(!eq.children.length){
  for(let j=0;j<48;j++){
   const bar=document.createElement('span');
   bar.style.animationDelay=(-Math.random()*2).toFixed(2)+'s';
   bar.style.animationDuration=(.45+Math.random()*1.1).toFixed(2)+'s';
   eq.appendChild(bar);
  }
 }
}

/* TV VE RADYO OYNATICISI */
function destroyStream(){
 playbackId++;
 clearTimeout(retryTimer);
 retryTimer=null;
 const v=$('video');
 v.pause();v.onplaying=null;v.onerror=null;
 if(hls){hls.destroy();hls=null}
 v.removeAttribute('src');v.load();
}
function loadChannel(){
 destroyStream();
 const item=activeRadio?RADIO[activeIndex]:TV[activeIndex];
 $('playerTitle').textContent=item[1]+' '+item[0];
 $('player').classList.toggle('radio-mode',activeRadio);
 $('ambientPalette').hidden=true;
 if(activeRadio)updateRadioCockpit();

 const urls=activeRadio?item[2]:item[3];
 if(!urls||!urls.length){
  message('Bu kanalın kullanılabilir yayın adresi bulunamadı.');
  return;
 }
 playSources(urls,0,playbackId);
}
function playSources(urls,index,id){
 if(id!==playbackId)return;
 if(index>=urls.length){
  message('Yayın açılamadı. Bağlantıyı kontrol edin.');
  return;
 }
 clearTimeout(retryTimer);
 if(hls){hls.destroy();hls=null}
 const v=$('video');
 v.pause();v.removeAttribute('src');v.load();

 const item=activeRadio?RADIO[activeIndex]:TV[activeIndex];
 const url=urls[index];
 let started=false,failed=false;
 message(item[0]+' bağlanıyor...');

 function next(reason){
  if(id!==playbackId||failed)return;
  failed=true;
  clearTimeout(retryTimer);
  if(hls){hls.destroy();hls=null}
  v.pause();v.removeAttribute('src');v.load();
  if(index+1<urls.length){
   message('Alternatif yayın deneniyor...');
   retryTimer=setTimeout(()=>playSources(urls,index+1,id),500);
  }else message(item[0]+' açılamadı ('+reason+').');
 }
 v.onplaying=()=>{
  if(id!==playbackId)return;
  started=true;clearTimeout(retryTimer);
  message('● '+item[0]+' canlı yayında');
 };
 v.onerror=()=>next('medya hatası');

 retryTimer=setTimeout(()=>{
  if(!started)next('bağlantı zaman aşımı');
 },14000);

 function start(){
  if(id!==playbackId)return;
  v.play().catch(err=>{
   if(id!==playbackId)return;
   if(err.name==='NotAllowedError'){
    clearTimeout(retryTimer);
    message('Oynat düğmesine basın.');
   }else next(err.name||'oynatma hatası');
  });
 }
 if(!url.includes('.m3u8')){v.src=url;start();return}
 if(v.canPlayType('application/vnd.apple.mpegurl')){
  v.src=url;start();return;
 }
 if(window.Hls&&Hls.isSupported()){
  hls=new Hls({enableWorker:true,maxBufferLength:20});
  hls.attachMedia(v);
  hls.on(Hls.Events.MEDIA_ATTACHED,()=>{
   if(id===playbackId)hls.loadSource(url);
  });
  hls.on(Hls.Events.MANIFEST_PARSED,start);
  hls.on(Hls.Events.ERROR,(event,data)=>{
   if(data.fatal)next(data.type||'HLS hatası');
  });
 }else next('HLS desteklenmiyor');
}
function retryChannel(){loadChannel()}
function changeChannel(d){
 const list=activeRadio?RADIO:TV;
 activeIndex=(activeIndex+d+list.length)%list.length;
 loadChannel();
}
function togglePlayback(){
 const v=$('video');
 if(v.paused)v.play().catch(err=>message('Oynatma hatası: '+err.name));
 else{v.pause();message('Yayın duraklatıldı.')}
}
function fullScreen(){
 const target=activeRadio?$('player'):$('video');
 if(target.requestFullscreen)target.requestFullscreen().catch(()=>{});
 else if(!activeRadio&&target.webkitEnterFullscreen){
  try{target.webkitEnterFullscreen()}catch(e){}
 }
}
function favoriteActive(){
 const item=activeRadio?RADIO[activeIndex]:TV[activeIndex];
 toggleFavorite(item[0]);
 message(item[0]+' favorileri güncellendi.');
}
function closePlayer(){
 clearTimeout(stationTimer);
 logoRequest++;
 destroyStream();
 $('player').classList.remove('open','radio-mode');
 $('ambientPalette').hidden=true;
 if(document.fullscreenElement&&document.exitFullscreen){
  document.exitFullscreen().catch(()=>{});
 }
 render();
}

/* MERCEDES KUMANDA VE KLAVYE */
function move(d){
 refreshFocus();
 if(!focusList.length)return;
 selected=(selected+d+focusList.length)%focusList.length;
 refreshFocus();
 if(focusList[selected]){
  focusList[selected].focus({preventScroll:true});
  focusList[selected].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
 }
}
document.addEventListener('keydown',e=>{
 if(document.activeElement.tagName==='INPUT'&&e.key!=='Escape')return;
 if($('player').classList.contains('open')){
  if(e.key==='Escape'||e.key==='Backspace'){
   e.preventDefault();closePlayer();
  }else if(e.key==='ArrowRight'){
   e.preventDefault();changeChannel(1);
  }else if(e.key==='ArrowLeft'){
   e.preventDefault();changeChannel(-1);
  }else if(e.key===' '){
   e.preventDefault();togglePlayback();
  }
  return;
 }
 if(e.key==='ArrowRight'||e.key==='ArrowDown'){
  e.preventDefault();move(1);
 }else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
  e.preventDefault();move(-1);
 }else if(e.key==='Enter'){
  e.preventDefault();
  if(focusList[selected])focusList[selected].click();
 }else if(e.key==='Escape'||e.key==='Backspace'){
  e.preventDefault();go(0);
 }
});
let lastWheel=0;
document.addEventListener('wheel',e=>{
 const now=Date.now();
 if(now-lastWheel<200)return;
 lastWheel=now;
 if($('player').classList.contains('open'))changeChannel(e.deltaY>0?1:-1);
 else move(e.deltaY>0?1:-1);
},{passive:true});

/* TÜRKİYE SAATİ */
function updateClock(){
 const now=new Date();
 $('date').textContent=new Intl.DateTimeFormat('tr-TR',{
  timeZone:'Europe/Istanbul',weekday:'long',day:'numeric',
  month:'long',year:'numeric'
 }).format(now);
 $('clock').textContent=new Intl.DateTimeFormat('tr-TR',{
  timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit',
  second:'2-digit',hourCycle:'h23'
 }).format(now);
}
updateClock();
setInterval(updateClock,1000);

/* ESKİŞEHİR HAVA DURUMU */
async function updateWeather(){
 try{
  const url='https://api.open-meteo.com/v1/forecast?latitude=39.7767&longitude=30.5206&current=temperature_2m&timezone=Europe%2FIstanbul';
  const response=await fetch(url);
  if(!response.ok)throw Error('Weather');
  const data=await response.json();
  $('temperature').textContent=Math.round(data.current.temperature_2m)+'°C';
 }catch(e){$('temperature').textContent='--°C'}
}
updateWeather();
setInterval(updateWeather,15*60*1000);

$('search').addEventListener('input',render);
render();
status('ŞEHZADE MEDIA V2 · '+TV.length+' TV · '+RADIO.length+' radyo');
</script>
