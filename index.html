<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<style>
:root{
 --bg:#060e1b;--panel:#12233a;--gold:#e3b978;
 --blue:#59a9ff;--txt:#f4f7fc;--muted:#a5b6cd;
 --accent:#59a9ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header{
 position:relative;min-height:170px;padding:32px 43% 22px 4%;
 background:linear-gradient(90deg,#07101df5,#07101d66),
 url("sehzade_istanbul_banner.jpg") center/cover;
 border-bottom:1px solid var(--gold)
}
.brand{font-size:clamp(25px,4vw,48px);font-weight:900;letter-spacing:2px;color:var(--gold)}
.brand span{color:white}
.tagline{font-size:12px;letter-spacing:2px;color:#d3deed;margin-top:10px}
.live{
 position:absolute;right:0;top:0;bottom:0;width:40%;
 display:flex;align-items:center;justify-content:center;gap:20px;
 background:#101b2cf5;padding:12px;box-shadow:-10px 0 25px #0008
}
.date{font-size:13px;color:#c2d1e2}
.time{font-size:clamp(25px,3.3vw,42px);font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.weather{border-left:1px solid #50627b;padding-left:15px;font-size:13px;line-height:1.8}
.weather b{color:var(--gold);font-size:20px}
main{padding:20px 4% 35px}
nav{display:flex;gap:9px;overflow-x:auto;padding-bottom:15px}
.menu{
 flex:none;background:#15253c;color:white;border:1px solid #3a4c64;
 border-radius:12px;padding:12px 16px;font-weight:700
}
.menu.active,.menu:hover,.menu.selected{background:var(--gold);color:#111923}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 20px}
h2{margin:0;font-size:24px}
#search{background:#17263b;color:white;border:1px solid #455b78;border-radius:12px;padding:13px;width:min(350px,100%)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.tile{
 min-height:140px;position:relative;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:13px;
 background:linear-gradient(140deg,#1c304b,#0d1829);
 border:1px solid #3c4e67;border-radius:16px;color:white;padding:15px
}
.tile:hover,.tile.selected{border-color:var(--gold);background:#293e59}
.tile .emoji{font-size:39px}
.tile strong{text-align:center;font-size:15px}
.star{position:absolute;top:7px;right:11px;color:var(--gold);font-size:25px}
footer{padding:15px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #293d55;color:var(--muted);font-size:12px}
footer button{background:#223650;color:white;border:1px solid #52637c;border-radius:9px;padding:10px 13px}

/* OYNATICI */
.player{position:fixed;inset:0;background:#010307;z-index:1000;display:none;flex-direction:column}
.player.open{display:flex}
.player-top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0e1828;padding:12px 18px}
.player-top strong{font-size:17px}
.player-top button,.controls button{
 background:#223650;border:1px solid #51647f;border-radius:10px;
 padding:10px 14px;color:white;font-weight:700
}
.player-top button:hover,.controls button:hover{background:#405b7d}
.video-area{position:relative;flex:1;min-height:0;background:black;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;object-fit:contain;background:black}
.player-bottom{background:#0e1828;padding:11px 16px 15px}
#message{min-height:17px;text-align:center;color:#b9c9dc;font-size:12px;margin-bottom:10px}
.controls{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}
.controls .gold{background:#886638}

/* LUXURY DIGITAL MUSIC COCKPIT */
.radio-display{position:absolute;inset:0;display:none;overflow:hidden;isolation:isolate}
#player.radio-mode #video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#player.radio-mode .radio-display{
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at 50% 55%,#1b3557 0%,#091526 46%,#02050d 90%)
}
#player.radio-mode .player-top,#player.radio-mode .player-bottom{
 background:#050b15;border-color:#ae8653
}
.lux-head{position:absolute;top:19px;left:24px;z-index:8;display:flex;flex-direction:column;gap:5px}
.lux-head b{font-size:17px;color:#dfbd84;letter-spacing:5px}
.lux-head small{font-size:10px;color:#b9c9dc;letter-spacing:4px}
.lux-live{position:absolute;top:23px;right:25px;z-index:8;color:#e8c99a;font-size:12px;letter-spacing:2px}
.lux-stage{width:100%;display:flex;align-items:center;justify-content:center;gap:22px;position:relative;z-index:4}
.lux-side{display:flex;gap:11px;align-items:center}
.lux-card{
 width:clamp(70px,10vw,135px);height:clamp(95px,14vw,150px);
 border:1px solid #a3c4e28a;border-radius:10px;
 background:linear-gradient(130deg,#24415e9c,#080f20d9);
 box-shadow:inset 0 0 24px #79b8f11e,0 0 20px #5b9fef26;
 backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
 color:#f5f7fc;text-align:center;font-size:clamp(11px,1.3vw,16px);
 font-weight:bold;padding:8px;overflow-wrap:anywhere;cursor:pointer;
 transition:transform .35s,border-color .35s
}
.lux-card:hover{transform:translateY(-6px) scale(1.05);border-color:#edc68b}
.lux-side .far{opacity:.55;transform:scale(.84)}
.lux-center{
 position:relative;width:clamp(165px,26vw,270px);
 height:clamp(165px,26vw,270px);
 display:flex;align-items:center;justify-content:center;flex:none
}
.lux-ring{
 position:absolute;inset:-7px;border:1px solid #e9bb79;border-radius:50%;
 box-shadow:0 0 24px #e9bb7966;animation:ringPulse 4s ease-in-out infinite
}
.lux-ring.second{
 inset:-21px;border-color:var(--accent);
 box-shadow:0 0 27px var(--accent);animation-delay:-2s
}
.lux-orb{
 position:relative;z-index:2;width:90%;height:90%;border-radius:50%;
 background:radial-gradient(circle at 32% 20%,#334c6a,#101c2f 45%,#02050b 90%);
 border:2px solid #e6bc7c;
 box-shadow:0 0 25px #d8a96288,0 0 50px #3f9cfb66,inset 0 0 35px #83b9f52d;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:10px;padding:17px;text-align:center;
 animation:orbPulse 3.5s ease-in-out infinite alternate
}
#luxLogo{
 font-size:clamp(19px,3vw,38px);font-weight:900;line-height:1.05;
 text-shadow:0 0 20px #4c9ce6;overflow-wrap:anywhere
}
#luxName{font-size:clamp(13px,1.6vw,20px)}
.lux-orb small{font-size:9px;color:#b6c8de;letter-spacing:2px}
.lux-wave{
 position:absolute;left:-15%;top:50%;width:130%;height:115px;
 border-radius:50%;pointer-events:none;z-index:1
}
.wave1{
 border-top:3px solid var(--accent);border-bottom:2px solid var(--accent);
 box-shadow:0 0 25px var(--accent);animation:waveFlow 4s ease-in-out infinite alternate
}
.wave2{
 border-top:2px solid #edbd7c;border-bottom:2px solid #edbd7c;
 box-shadow:0 0 28px #edbd7c;animation:waveFlow 5s ease-in-out infinite alternate-reverse
}
.wave3{
 border-top:1px solid #8fd1ff;border-bottom:1px solid #c9a06a;
 opacity:.6;animation:waveFlow 6s ease-in-out infinite alternate
}
.lux-eq{
 position:absolute;bottom:36px;left:15%;width:70%;height:42px;
 z-index:3;display:flex;align-items:center;justify-content:center;gap:4px
}
.lux-eq span{
 flex:1;max-width:7px;height:9px;border-radius:4px;
 background:linear-gradient(to top,var(--accent),#b9e3ff,#f1bf7e);
 box-shadow:0 0 8px var(--accent);
 animation:barPulse 1s ease-in-out infinite alternate
}
.lux-foot{position:absolute;bottom:10px;color:#a3b7cf;font-size:10px;letter-spacing:4px;z-index:3}
.radio-controls{display:none}
#player.radio-mode .radio-controls{display:flex;gap:10px;justify-content:center;margin-bottom:8px;align-items:center}
.radio-controls button{
 background:#172c45;color:#fff;border:1px solid #b58c59;
 border-radius:10px;padding:8px 12px
}
.radio-controls .ambient{color:#f4d3a0}
.radio-controls select{background:#15253c;color:white;border:1px solid #ad8c60;border-radius:9px;padding:8px}
#player.radio-mode .controls .gold{background:#9b713a}

@keyframes ringPulse{
 0%,100%{transform:scale(.97);opacity:.35}
 50%{transform:scale(1.05);opacity:1}
}
@keyframes orbPulse{
 from{transform:scale(.98);box-shadow:0 0 16px #d4a562,0 0 35px #409aff55}
 to{transform:scale(1.025);box-shadow:0 0 30px #edc582,0 0 65px #409affaa}
}
@keyframes waveFlow{
 from{transform:translateY(-65%) rotate(-7deg) scaleY(.65)}
 to{transform:translateY(-35%) rotate(7deg) scaleY(1.5)}
}
@keyframes barPulse{
 from{height:5px;opacity:.4}
 to{height:38px;opacity:1}
}
@media(max-width:800px){
 header{padding:110px 15px 18px;min-height:215px}
 .live{width:100%;height:96px;bottom:auto;gap:12px}

 .brand{font-size:29px}.tagline{font-size:10px}
 main{padding:15px}

 .tile{min-height:115px}.tile .emoji{font-size:31px}.tile strong{font-size:13px}
 .player-top{padding:8px}.player-top strong{font-size:14px}
 .controls{gap:5px}.controls button{font-size:11px;padding:8px 7px}
 .lux-head{top:8px;left:10px}.lux-head b{font-size:11px;letter-spacing:2px}
 .lux-head small{font-size:8px;letter-spacing:1px}
 .lux-live{top:12px;right:10px;font-size:9px;letter-spacing:0}
 .lux-stage{gap:7px}.lux-side{gap:4px}
 .lux-center{width:155px;height:155px}
 .lux-card{width:65px;height:85px;font-size:10px;padding:5px}
 .lux-eq{bottom:22px;height:20px}.lux-foot{bottom:4px;font-size:8px}
}
@media(max-width:600px){
 .lux-side .far{display:none}
 .lux-center{width:125px;height:125px}
 .lux-card{width:58px;height:65px;font-size:9px}
 .lux-orb small{display:none}
 .lux-head small{display:none}
}
@media(prefers-reduced-motion:reduce){
 .lux-ring,.lux-orb,.lux-wave,.lux-eq span{animation:none}
}
</style>
</head>

const MENU=[
['Tüm TV','📺'],['Ulusal','🇹🇷'],['Haber','📰'],
['Spor','⚽'],['Ekonomi','💹'],['Belgesel','🌍'],
['Çocuk','🧸'],['Radyo','📻'],['Favoriler','⭐'],
['YouTube','▶️']
];

let page=0,selected=0,focusList=[];
let activeIndex=0,activeRadio=false;
let hls=null,playbackId=0,retryTimer=null,lastWheel=0;
let favorites=[];

try{
 favorites=JSON.parse(localStorage.getItem('sehzade_favorites')||'[]');
 if(!Array.isArray(favorites))favorites=[];
}catch(e){favorites=[]}

function status(t){$('status').textContent=t}
function message(t){$('message').textContent=t}

function saveFavorites(){
 try{localStorage.setItem('sehzade_favorites',JSON.stringify(favorites))}
 catch(e){}
}
function toggleFavorite(name){
 favorites=favorites.includes(name)
 ?favorites.filter(x=>x!==name):[...favorites,name];
 saveFavorites();render();
}
function items(){
 if(page===0)return TV;
 if(page>=1&&page<=6)return TV.filter(x=>x[2]===MENU[page][0]);
 if(page===7)return RADIO;
 if(page===8)return [
  ...TV.filter(x=>favorites.includes(x[0])),
  ...RADIO.filter(x=>favorites.includes(x[0]))
 ];
 return [
  ['YouTube Ana Sayfa','▶️'],
  ['Eskişehirspor','⚽'],
  ['Türkçe Müzik','🎵'],
  ['Belgesel','🌍'],
  ['Çocuk Şarkıları','🧸']
 ];
}

function render(){
 $('nav').replaceChildren();
 MENU.forEach((m,i)=>{
  const b=document.createElement('button');
  b.className='menu'+(page===i?' active':'');
  b.dataset.focus='1';
  b.textContent=m[1]+' '+m[0];
  b.onclick=()=>go(i);
  $('nav').appendChild(b);
 });

 $('heading').textContent=MENU[page][1]+' '+MENU[page][0];
 $('cards').replaceChildren();

 const q=$('search').value.toLocaleLowerCase('tr-TR');
 const filtered=items().filter(x=>
  x[0].toLocaleLowerCase('tr-TR').includes(q)
 );

 filtered.forEach(item=>{
  const b=document.createElement('button');
  b.className='tile';b.dataset.focus='1';

  const icon=document.createElement('span');
  icon.className='emoji';icon.textContent=item[1];
  const name=document.createElement('strong');
  name.textContent=item[0];
  b.append(icon,name);
  b.onclick=()=>openItem(item);

  if(page!==9){
   const star=document.createElement('span');
   star.className='star';
   star.textContent=favorites.includes(item[0])?'★':'☆';
   star.onclick=e=>{
    e.stopPropagation();toggleFavorite(item[0]);
   };
   b.appendChild(star);
  }
  $('cards').appendChild(b);
 });

 if(!filtered.length){
  const p=document.createElement('p');
  p.textContent='Sonuç bulunamadı.';
  $('cards').appendChild(p);
 }
 refreshFocus();
}

function refreshFocus(){
 focusList=[...document.querySelectorAll(
  '#nav [data-focus],#cards [data-focus],footer button'
 )];
 selected=Math.max(0,Math.min(selected,focusList.length-1));
 focusList.forEach(x=>x.classList.remove('selected'));
 if(focusList[selected])focusList[selected].classList.add('selected');
}
function go(i){
 if($('player').classList.contains('open'))closePlayer();
 page=i;selected=0;$('search').value='';render();
 status(MENU[i][0]+' açıldı');
}
function home(){go(0)}

function openItem(item){
 if(page===9){
  const url=item[0]==='YouTube Ana Sayfa'
  ?'https://m.youtube.com/'
  :'https://m.youtube.com/results?search_query='+encodeURIComponent(item[0]);
  window.open(url,'_blank');return;
 }
 const ti=TV.findIndex(x=>x[0]===item[0]);
 if(ti>=0){activeRadio=false;activeIndex=ti}
 else{
  const ri=RADIO.findIndex(x=>x[0]===item[0]);
  if(ri<0)return;
  activeRadio=true;activeIndex=ri;
 }
 $('player').classList.add('open');
 $('player').classList.toggle('radio-mode',activeRadio);
 loadChannel();
}

/* RADYO DİJİTAL KOKPİT */
const RADIO_MARKS={
 'TRT FM':'TRT FM','TRT Radyo 1':'TRT 1',
 'PowerTürk':'POWER TÜRK','Metro FM':'METRO FM',
 'JoyTürk':'JOY TÜRK','Kral Pop':'KRAL POP',
 'SlowTürk':'SLOW TÜRK','Radyo 7':'RADYO 7'
};

function updateRadioCockpit(){
 const n=RADIO.length,i=activeIndex,name=RADIO[i][0];
 $('luxLogo').textContent=RADIO_MARKS[name]||name;
 $('luxName').textContent=name;

 $('luxPrev').textContent=RADIO[(i-1+n)%n][0];
 $('luxPrev2').textContent=RADIO[(i-2+n)%n][0];
 $('luxNext').textContent=RADIO[(i+1)%n][0];
 $('luxNext2').textContent=RADIO[(i+2)%n][0];

 const orb=document.querySelector('.lux-orb');
 orb.style.animation='none';
 void orb.offsetWidth;
 orb.style.animation='';

 const eq=$('luxEqualizer');
 if(!eq.children.length){
  for(let j=0;j<48;j++){
   const bar=document.createElement('span');
   bar.style.animationDelay=(-Math.random()*2).toFixed(2)+'s';
   bar.style.animationDuration=(.45+Math.random()*1.1).toFixed(2)+'s';
   eq.appendChild(bar);
  }
 }
}

const ambientColors=[
 '#59a9ff','#aa75ff','#edb96f',
 '#ff526f','#42d7b1','#f5f5f5'
];

function setAmbient(color){
 if(!ambientColors.includes(color))return;
 document.documentElement.style.setProperty('--accent',color);
 $('ambientSelect').value=color;
 try{localStorage.setItem('sehzade_ambient',color)}catch(e){}
}
function cycleAmbient(){
 const current=$('ambientSelect').value;
 const i=ambientColors.indexOf(current);
 setAmbient(ambientColors[(i+1)%ambientColors.length]);
}
try{
 setAmbient(localStorage.getItem('sehzade_ambient')||'#59a9ff');
}catch(e){setAmbient('#59a9ff')}

/* YAYIN OYNATICISI */
function destroyStream(){
 playbackId++;
 clearTimeout(retryTimer);retryTimer=null;
 const v=$('video');
 v.pause();v.onplaying=null;v.onerror=null;
 if(hls){hls.destroy();hls=null}
 v.removeAttribute('src');v.load();
}

function loadChannel(){
 destroyStream();
 const item=activeRadio?RADIO[activeIndex]:TV[activeIndex];
 $('playerTitle').textContent=item[1]+' '+item[0];
 $('player').classList.toggle('radio-mode',activeRadio);

 if(activeRadio)updateRadioCockpit();

 const urls=activeRadio?item[2]:item[3];
 if(!urls||!urls.length){
  message('Bu kanal için kullanılabilir yayın adresi bulunamadı.');
  return;
 }
 playSources(urls,0,playbackId);
}

function playSources(urls,index,id){
 if(id!==playbackId)return;
 if(index>=urls.length){
  message('Yayın açılamadı. Bağlantı veya cihaz desteği kontrol edilmeli.');
  return;
 }

 clearTimeout(retryTimer);
 if(hls){hls.destroy();hls=null}

 const v=$('video');
 v.pause();v.removeAttribute('src');v.load();

 const item=activeRadio?RADIO[activeIndex]:TV[activeIndex];
 const url=urls[index];
 message(item[0]+' bağlanıyor... ('+(index+1)+'/'+urls.length+')');

 let started=false,failed=false;

 function next(reason){
  if(id!==playbackId||failed)return;
  failed=true;
  clearTimeout(retryTimer);retryTimer=null;
  if(hls){hls.destroy();hls=null}
  v.pause();v.removeAttribute('src');v.load();

  if(index+1<urls.length){
   message('Alternatif yayın deneniyor...');
   retryTimer=setTimeout(()=>playSources(urls,index+1,id),500);
  }else{
   message(item[0]+' açılamadı ('+reason+').');
  }
 }

 v.onplaying=()=>{
  if(id!==playbackId)return;
  started=true;
  clearTimeout(retryTimer);retryTimer=null;
  message('● '+item[0]+' canlı yayında');
 };
 v.onerror=()=>next('medya hatası');

 retryTimer=setTimeout(()=>{
  if(!started)next('bağlantı zaman aşımı');
 },14000);

 function start(){
  if(id!==playbackId)return;
  v.play().catch(err=>{
   if(id!==playbackId)return;
   if(err.name==='NotAllowedError'){
    clearTimeout(retryTimer);retryTimer=null;
    message('Otomatik oynatma engellendi. Oynat düğmesine basın.');
   }else next(err.name||'oynatma hatası');
  });
 }

 const isHLS=url.includes('.m3u8');
 if(!isHLS){v.src=url;start();return}

 if(v.canPlayType('application/vnd.apple.mpegurl')){
  v.src=url;start();return;
 }

 if(window.Hls&&Hls.isSupported()){
  hls=new Hls({
   enableWorker:true,
   maxBufferLength:20,
   manifestLoadingTimeOut:10000,
   fragLoadingTimeOut:10000
  });
  hls.attachMedia(v);
  hls.on(Hls.Events.MEDIA_ATTACHED,()=>{
   if(id===playbackId)hls.loadSource(url);
  });
  hls.on(Hls.Events.MANIFEST_PARSED,start);
  hls.on(Hls.Events.ERROR,(event,data)=>{
   if(data.fatal)next(data.type||'HLS hatası');
  });
 }else next('HLS desteklenmiyor');
}

function retryChannel(){loadChannel()}

function changeChannel(direction){
 const list=activeRadio?RADIO:TV;
 activeIndex=(activeIndex+direction+list.length)%list.length;
 loadChannel();
}

function togglePlayback(){
 const v=$('video');
 if(v.paused){
  v.play().catch(err=>message('Oynatma başarısız: '+err.name));
 }else{
  v.pause();message('Yayın duraklatıldı.');
 }
}

function fullScreen(){
 const target=activeRadio?$('player'):$('video');
 if(target.requestFullscreen){
  target.requestFullscreen().catch(()=>{});
 }else if(!activeRadio&&target.webkitEnterFullscreen){
  try{target.webkitEnterFullscreen()}catch(e){}
 }
}

function favoriteActive(){
 const item=activeRadio?RADIO[activeIndex]:TV[activeIndex];
 toggleFavorite(item[0]);
 message(item[0]+' favorileri güncellendi.');
}

function closePlayer(){
 destroyStream();
 $('player').classList.remove('open','radio-mode');
 if(document.fullscreenElement&&document.exitFullscreen){
  document.exitFullscreen().catch(()=>{});
 }
 render();
}

/* MERCEDES KUMANDA / KLAVYE */
function move(direction){
 refreshFocus();
 if(!focusList.length)return;
 selected=(selected+direction+focusList.length)%focusList.length;
 refreshFocus();
 if(focusList[selected]){
  focusList[selected].focus({preventScroll:true});
  focusList[selected].scrollIntoView({
   block:'nearest',inline:'nearest',behavior:'smooth'
  });
 }
}

document.addEventListener('keydown',e=>{
 if(document.activeElement.tagName==='INPUT'&&e.key!=='Escape')return;

 const open=$('player').classList.contains('open');
 if(open){
  if(e.key==='Escape'||e.key==='Backspace'){
   e.preventDefault();closePlayer();
  }else if(e.key==='ArrowRight'){
   e.preventDefault();changeChannel(1);
  }else if(e.key==='ArrowLeft'){
   e.preventDefault();changeChannel(-1);
  }else if(e.key===' '){
   e.preventDefault();togglePlayback();
  }
  return;
 }

 if(e.key==='ArrowRight'||e.key==='ArrowDown'){
  e.preventDefault();move(1);
 }else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
  e.preventDefault();move(-1);
 }else if(e.key==='Enter'){
  e.preventDefault();
  if(focusList[selected])focusList[selected].click();
 }else if(e.key==='Escape'||e.key==='Backspace'){
  e.preventDefault();home();
 }
});

document.addEventListener('wheel',e=>{
 const now=Date.now();
 if(now-lastWheel<200)return;
 lastWheel=now;
 if($('player').classList.contains('open')){
  changeChannel(e.deltaY>0?1:-1);
 }else move(e.deltaY>0?1:-1);
},{passive:true});

/* CANLI TÜRKİYE SAATİ */
function updateClock(){
 const now=new Date();
 $('liveDate').textContent=new Intl.DateTimeFormat('tr-TR',{
  timeZone:'Europe/Istanbul',weekday:'long',
  day:'numeric',month:'long',year:'numeric'
 }).format(now);
 $('liveTime').textContent=new Intl.DateTimeFormat('tr-TR',{
  timeZone:'Europe/Istanbul',hour:'2-digit',
  minute:'2-digit',second:'2-digit',hourCycle:'h23'
 }).format(now);
}
updateClock();
setInterval(updateClock,1000);

/* ESKİŞEHİR HAVA DURUMU */
async function updateWeather(){
 try{
  const url='https://api.open-meteo.com/v1/forecast'
   +'?latitude=39.7767&longitude=30.5206'
   +'&current=temperature_2m,weather_code'
   +'&timezone=Europe%2FIstanbul';
  const res=await fetch(url);
  if(!res.ok)throw Error('Hava durumu');
  const data=await res.json();
  const code=data.current.weather_code;
  $('weatherIcon').textContent=
   code===0?'☀️':code<=3?'⛅':code<=48?'🌫️':
   code<=67?'🌧️':code<=77?'❄️':'⛈️';
  $('weatherTemp').textContent=
   Math.round(data.current.temperature_2m)+'°C';
 }catch(e){
  $('weatherTemp').textContent='--°C';
 }
}
updateWeather();
setInterval(updateWeather,15*60*1000);

$('search').addEventListener('input',render);
render();
status('ŞEHZADE MEDIA · '+TV.length+' TV · '+RADIO.length+' radyo');
</script>
</body>
</html>
