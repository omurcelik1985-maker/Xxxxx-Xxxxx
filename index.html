
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071525">
<title>ŞEHZADE MEDIA</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<style>
:root{
  --bg:#071525;
  --panel:#102c46;
  --gold:#e9c57d;
  --blue:#39aaff;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(145deg,#071525,#123454);
  color:white;
  font-family:Arial,sans-serif;
}
button,input{font-family:inherit}
button{cursor:pointer;color:white}
header{
  min-height:185px;
  padding:24px 4%;
  background:
    linear-gradient(90deg,#061322ee,#06132255),
    url("sehzade_istanbul_banner.jpg") center/cover;
  border-bottom:2px solid #b99b65;
}
.logo{
  font-size:clamp(27px,4vw,43px);
  color:var(--gold);
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 3px 12px #000;
}
.logo span{color:white;font-weight:400}
.subtitle{
  margin-top:10px;
  letter-spacing:2px;
  font-size:12px;
}
#clock{margin-top:20px}
main{padding:20px 4% 105px}
nav,.grid{
  display:grid;
  gap:12px;
}
nav{grid-template-columns:repeat(6,minmax(0,1fr))}
.grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.menu,.tile,.control{
  border:1px solid #547b9a;
  border-radius:12px;
  background:linear-gradient(145deg,#193e5f,#0b2036);
}
.menu{
  padding:15px 6px;
  min-height:105px;
  font-size:15px;
}
.tile{
  position:relative;
  min-height:112px;
  padding:15px 8px;
  font-size:15px;
}
.emoji{
  display:block;
  font-size:29px;
  margin-bottom:10px;
}
.menu.active{border-color:var(--gold)}
.selected,button:focus-visible{
  outline:3px solid var(--blue)!important;
  box-shadow:0 0 14px #39aaff88;
}
h2{font-size:21px}
.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
#search{
  width:220px;
  max-width:45vw;
  padding:12px;
  border:1px solid #6084a1;
  border-radius:9px;
  background:#102b45;
  color:white;
}
.star{
  position:absolute;
  right:4px;
  top:3px;
  background:none;
  border:0;
  color:var(--gold);
  font-size:23px;
}
.control{
  padding:13px 17px;
  font-size:15px;
}
footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  width:100%;
  z-index:20;
  background:#061322f5;
  border-top:1px solid #53718b;
  padding:12px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
#status{
  color:#b9cddd;
  font-size:12px;
  text-align:center;
}
#player{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  overflow:auto;
  background:#061322;
  padding:16px 3%;
}
#player.open{display:block}
.player-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
#video{
  width:100%;
  max-height:65vh;
  aspect-ratio:16/9;
  background:black;
  border:1px solid var(--gold);
  border-radius:12px;
}
#playerMessage{
  color:#c4d6e5;
  text-align:center;
  min-height:24px;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
}
.note{
  color:#a8bfd2;
  font-size:12px;
  margin-top:25px;
  line-height:1.6;
}
@media(max-width:950px){
  nav{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:550px){
  header{min-height:145px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .menu{min-height:85px}
  #status{display:none}
  .control{padding:12px 9px}
}
</style>
</head>

<body>
<header>
  <div class="logo">♛ ŞEHZADE <span>MEDIA</span></div>
  <div class="subtitle">
    TV · RADYO · YOUTUBE · ÇOCUK · FAVORİLER
  </div>
  <div id="clock"></div>
</header>

<main>
  <nav id="nav"></nav>

  <div class="bar">
    <h2 id="heading">📺 Canlı TV</h2>
    <input id="search" placeholder="İçerik ara">
  </div>

  <div id="cards" class="grid"></div>
  <div id="extra"></div>

  <p class="note">
    Canlı yayınlar, yayın sağlayıcısının erişim iznine
    ve tarayıcının video desteğine bağlıdır.
    Araç ekranında video yalnızca park hâlindeyken kullanılmalıdır.
  </p>
</main>

<footer>
  <button class="control" onclick="home()">❮ Ana Menü</button>
  <span id="status">ŞEHZADE MEDIA hazır</span>
  <button class="control" onclick="listen()">🎙️ Sesli Komut</button>
</footer>

<section id="player">
  <div class="player-head">
    <h2 id="playerTitle">Canlı Yayın</h2>
    <button class="control" onclick="closePlayer()">✕ Kapat</button>
  </div>

  <video id="video" controls playsinline preload="none"></video>

  <p id="playerMessage">Yayın hazırlanıyor...</p>

  <div class="actions">
    <button class="control" onclick="changeChannel(-1)">⏮ Önceki</button>
    <button class="control" onclick="togglePlayback()">⏯ Oynat / Duraklat</button>
    <button class="control" onclick="changeChannel(1)">Sonraki ⏭</button>
    <button class="control" onclick="fullScreenPlayer()">⛶ Tam Ekran</button>
    <button class="control" onclick="favoriteActive()">☆ Favori</button>
  </div>
</section>

<script>
"use strict";

const $ = id => document.getElementById(id);

/*
  TRT yayın adresleri:
  Kamuya açık olarak kullanılan HLS bağlantılarıdır.
  Çalışmaları veya sürekli erişilebilir olmaları garanti değildir.
*/
const STREAMS = {
  "TRT 1":
    "https://tv-trt1.medya.trt.com.tr/master.m3u8",
  "TRT Spor":
    "https://tv-trtspor.medya.trt.com.tr/master_720.m3u8",
  "TRT Haber":
    "https://tv-trt-haber.medya.trt.com.tr/master_720.m3u8",
  "TRT Belgesel":
    "https://tv-trtbelgesel.medya.trt.com.tr/master_720.m3u8",
  "ATV":"",
  "Kanal D":"",
  "Show TV":"",
  "Star TV":"",
  "NOW":"",
  "TV8":"",
  "A Haber":"",
  "NTV":""
};

const RADIO_STREAMS = {
  "TRT FM":"",
  "TRT Radyo 1":"",
  "PowerTürk":"",
  "Metro FM":"",
  "JoyTürk":"",
  "Kral Pop":"",
  "SlowTürk":"",
  "Radyo 7":""
};

const tv = [
  ["TRT 1","📺","tv"],
  ["TRT Spor","⚽","tv"],
  ["TRT Haber","📰","tv"],
  ["TRT Belgesel","🌍","tv"],
  ["ATV","📺","tv"],
  ["Kanal D","📺","tv"],
  ["Show TV","📺","tv"],
  ["Star TV","⭐","tv"],
  ["NOW","📺","tv"],
  ["TV8","📺","tv"],
  ["A Haber","📰","tv"],
  ["NTV","📰","tv"]
];

const radio = [
  ["TRT FM","📻","radio"],
  ["TRT Radyo 1","🎙️","radio"],
  ["PowerTürk","🎵","radio"],
  ["Metro FM","🎧","radio"],
  ["JoyTürk","🎶","radio"],
  ["Kral Pop","🎼","radio"],
  ["SlowTürk","💛","radio"],
  ["Radyo 7","📻","radio"]
];

const youtube = [
  ["YouTube","▶️","https://m.youtube.com/"],
  ["Eskişehirspor","⚽","yt:Eskişehirspor"],
  ["Spor Özetleri","🏆","yt:spor özetleri"],
  ["Türkçe Müzik","🎸","yt:Türkçe müzik"],
  ["Belgeseller","🌍","yt:Türkçe belgesel"],
  ["Otomobil","🚘","yt:otomobil inceleme"]
];

const kids = [
  ["TRT Çocuk","🧸","https://www.trtcocuk.net.tr/"],
  ["YouTube Kids","🌈","https://www.youtubekids.com/"],
  ["Pepee","🐥","yt:Pepee"],
  ["Rafadan Tayfa","🎈","yt:Rafadan Tayfa"],
  ["Niloya","🌸","yt:Niloya"],
  ["Bilim ve Deney","🔬","yt:çocuk bilim deneyleri"]
];

const sections = [
  ["Canlı TV","📺",tv],
  ["Radyo","📻",radio],
  ["YouTube","▶️",youtube],
  ["Çocuk","🧸",kids],
  ["Favoriler","⭐",[]],
  ["Sesli Komut","🎙️",[]]
];

const allItems = [...tv,...radio,...youtube,...kids];

let page = 0;
let selected = 0;
let focusList = [];
let lastWheel = 0;

let activeType = "tv";
let activeIndex = 0;
let hls = null;
let recognition = null;
let favorites = [];

try {
  favorites = JSON.parse(
    localStorage.getItem("sehzade_favorites") || "[]"
  );
  if (!Array.isArray(favorites)) favorites = [];
} catch(e) {
  favorites = [];
}

function status(message) {
  $("status").textContent = message;
}

function saveFavorites() {
  try {
    localStorage.setItem(
      "sehzade_favorites",
      JSON.stringify(favorites)
    );
  } catch(e) {}
}

function toggleFavorite(name) {
  if (favorites.includes(name)) {
    favorites = favorites.filter(x => x !== name);
  } else {
    favorites.push(name);
  }
  saveFavorites();
  render();
}

function currentItems() {
  if (page === 4) {
    return allItems.filter(x => favorites.includes(x[0]));
  }

  if (page === 5) {
    return [
      ["Dinlemeyi Başlat","🎤","voice"],
      ["Komut Yardımı","💬","help"]
    ];
  }

  return sections[page][2];
}

function makeCard(item) {
  const card = document.createElement("button");
  card.className = "tile";
  card.dataset.focus = "1";

  const icon = document.createElement("span");
  icon.className = "emoji";
  icon.textContent = item[1];

  const title = document.createElement("strong");
  title.textContent = item[0];

  card.append(icon,title);
  card.onclick = () => openItem(item);

  if (item[2] !== "voice" && item[2] !== "help") {
    const star = document.createElement("span");
    star.className = "star";
    star.textContent =
      favorites.includes(item[0]) ? "★" : "☆";

    star.onclick = e => {
      e.stopPropagation();
      toggleFavorite(item[0]);
    };

    card.appendChild(star);
  }

  return card;
}

function drawCards(container,items) {
  container.replaceChildren(...items.map(makeCard));
}

function render() {
  $("nav").replaceChildren();

  sections.forEach((section,index) => {
    const b = document.createElement("button");
    b.className =
      "menu" + (index === page ? " active" : "");
    b.dataset.focus = "1";

    const icon = document.createElement("span");
    icon.className = "emoji";
    icon.textContent = section[1];

    const name = document.createElement("strong");
    name.textContent = section[0];

    b.append(icon,name);
    b.onclick = () => go(index);
    $("nav").appendChild(b);
  });

  $("heading").textContent =
    sections[page][1] + " " + sections[page][0];

  const query =
    $("search").value.toLocaleLowerCase("tr-TR");

  drawCards(
    $("cards"),
    currentItems().filter(item =>
      item[0].toLocaleLowerCase("tr-TR").includes(query)
    )
  );

  $("extra").replaceChildren();

  if (page === 0) {
    const groups = [
      ["📻 Popüler Radyolar",radio.slice(0,6),1],
      ["▶️ YouTube",youtube.slice(0,6),2],
      ["🧸 Çocuk İçerikleri",kids.slice(0,6),3]
    ];

    groups.forEach(group => {
      const heading = document.createElement("h2");
      heading.textContent = group[0];

      const more = document.createElement("button");
      more.className = "control";
      more.textContent = "Tümünü Gör";
      more.onclick = () => go(group[2]);

      const grid = document.createElement("div");
      grid.className = "grid";
      drawCards(grid,group[1]);

      heading.append(" ",more);
      $("extra").append(heading,grid);
    });
  }

  refreshFocus();
}

function refreshFocus() {
  focusList = [
    ...document.querySelectorAll(
      '#nav [data-focus="1"],' +
      '#cards [data-focus="1"],' +
      '#extra [data-focus="1"],' +
      'footer button'
    )
  ];

  selected = Math.max(
    0,
    Math.min(selected,focusList.length-1)
  );

  focusList.forEach(el =>
    el.classList.remove("selected")
  );

  if (focusList[selected]) {
    focusList[selected].classList.add("selected");
  }
}

function go(index) {
  page = index;
  selected = index;
  $("search").value = "";
  render();
  status(sections[index][0] + " açıldı");
}

function home() {
  closePlayer();
  go(0);
}

function move(direction) {
  if ($("player").classList.contains("open")) {
    const buttons = [
      ...$("player").querySelectorAll("button")
    ];

    if (!buttons.length) return;

    let index = buttons.indexOf(document.activeElement);
    index =
      (index + direction + buttons.length)
      % buttons.length;

    buttons[index].focus();
    return;
  }

  refreshFocus();

  if (!focusList.length) return;

  selected =
    (selected + direction + focusList.length)
    % focusList.length;

  refreshFocus();

  focusList[selected].scrollIntoView({
    block:"nearest"
  });
}

function openItem(item) {
  if (!item) return;

  if (item[2] === "tv" || item[2] === "radio") {
    openPlayer(item[0],item[2]);
    return;
  }

  if (item[2] === "voice") {
    listen();
    return;
  }

  if (item[2] === "help") {
    alert(
      'Sesli komut örnekleri:\n' +
      '"TRT 1 aç"\n' +
      '"TRT Spor aç"\n' +
      '"Radyo aç"\n' +
      '"Favorilerimi göster"\n' +
      '"Ana menü"'
    );
    return;
  }

  let url = item[2];

  if (url.startsWith("yt:")) {
    url =
      "https://m.youtube.com/results?search_query=" +
      encodeURIComponent(url.slice(3));
  }

  const win = window.open(url,"_blank");

  if (!win) {
    status("Tarayıcı yeni pencereyi engelledi.");
  }
}

function openPlayer(name,type) {
  activeType = type;

  const list = type === "radio" ? radio : tv;
  const index = list.findIndex(x => x[0] === name);

  if (index < 0) return;

  activeIndex = index;

  $("player").classList.add("open");
  loadChannel();

  $("player").querySelector("button").focus();
}

function destroyStream() {
  const video = $("video");

  video.pause();

  if (hls) {
    hls.destroy();
    hls = null;
  }

  video.removeAttribute("src");
  video.load();
}

function loadChannel() {
  destroyStream();

  const list = activeType === "radio" ? radio : tv;
  const item = list[activeIndex];

  $("playerTitle").textContent =
    item[1] + " " + item[0];

  const url = activeType === "radio"
    ? RADIO_STREAMS[item[0]]
    : STREAMS[item[0]];

  if (!url) {
    $("playerMessage").textContent =
      "Bu kanalın doğrudan yayın bağlantısı henüz " +
      "tanımlanmadı.";
    return;
  }

  $("playerMessage").textContent =
    "Canlı yayın bağlanıyor...";

  const video = $("video");

  video.onerror = () => {
    $("playerMessage").textContent =
      "Yayın açılamadı. Bağlantı veya tarayıcı " +
      "desteği kontrol edilmeli.";
  };

  if (url.includes(".m3u8")) {
    // Önce tarayıcının yerel HLS desteğini dene
    if (
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ) {
      video.src = url;
      startVideo();
      return;
    }

    // Yerel HLS yoksa HLS.js kullan
    if (
      window.Hls &&
      Hls.isSupported()
    ) {
      hls = new Hls({
        enableWorker:true,
        lowLatencyMode:false,
        maxBufferLength:20
      });

      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED,() => {
        startVideo();
      });

      hls.on(Hls.Events.ERROR,(event,data) => {
        if (data.fatal) {
          $("playerMessage").textContent =
            "Yayın hatası: " + data.type +
            ". Bağlantı engellenmiş veya " +
            "erişilemiyor olabilir.";

          if (hls) {
            hls.destroy();
            hls = null;
          }
        }
      });

      return;
    }

    $("playerMessage").textContent =
      "Bu tarayıcı HLS canlı yayın biçimini " +
      "desteklemiyor.";
    return;
  }

  video.src = url;
  startVideo();
}

function startVideo() {
  const video = $("video");

  video.play().then(() => {
    $("playerMessage").textContent =
      "Canlı yayın oynatılıyor.";
  }).catch(() => {
    $("playerMessage").textContent =
      "Oynat düğmesine basın. Yayın başlamazsa " +
      "tarayıcı veya bağlantı engeli olabilir.";
  });
}

function changeChannel(direction) {
  const list = activeType === "radio" ? radio : tv;

  activeIndex =
    (activeIndex + direction + list.length)
    % list.length;

  loadChannel();
}

function togglePlayback() {
  const video = $("video");

  if (video.paused) {
    startVideo();
  } else {
    video.pause();
    $("playerMessage").textContent =
      "Yayın duraklatıldı.";
  }
}

function fullScreenPlayer() {
  const video = $("video");

  if (video.requestFullscreen) {
    video.requestFullscreen().catch(() => {});
  } else if (video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();
  }
}

function favoriteActive() {
  const list = activeType === "radio" ? radio : tv;
  toggleFavorite(list[activeIndex][0]);
}

function closePlayer() {
  destroyStream();
  $("player").classList.remove("open");
}

function command(text) {
  const s = text.toLocaleLowerCase("tr-TR");

  status("Duyulan: " + text);

  if (s.includes("favori")) {
    go(4);
    return;
  }

  if (
    s.includes("ana menü") ||
    s.includes("başa dön")
  ) {
    home();
    return;
  }

  const channel = [...tv,...radio].find(item =>
    s.includes(item[0].toLocaleLowerCase("tr-TR"))
  );

  if (channel) {
    openItem(channel);
    return;
  }

  if (s.includes("radyo")) go(1);
  else if (s.includes("youtube")) go(2);
  else if (s.includes("çocuk")) go(3);
  else if (
    s.includes("tv") ||
    s.includes("televizyon")
  ) go(0);
  else status("Komut bulunamadı: " + text);
}

function listen() {
  const Speech =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Speech) {
    alert(
      "Bu tarayıcı Türkçe sesli komutu " +
      "desteklemiyor olabilir."
    );
    return;
  }

  try {
    if (recognition) recognition.abort();

    recognition = new Speech();
    recognition.lang = "tr-TR";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      status("Dinliyorum...");
    };

    recognition.onresult = event => {
      command(event.results[0][0].transcript);
    };

    recognition.onerror = event => {
      status("Mikrofon hatası: " + event.error);
    };

    recognition.start();
  } catch(e) {
    status("Mikrofon başlatılamadı.");
  }
}

document.addEventListener("keydown",event => {
  if (document.activeElement === $("search")) {
    if (event.key === "Escape") {
      $("search").blur();
    }
    return;
  }

  if (
    ["ArrowDown","ArrowRight","ArrowUp","ArrowLeft"]
      .includes(event.key)
  ) {
    event.preventDefault();

    move(
      ["ArrowDown","ArrowRight"].includes(event.key)
      ? 1 : -1
    );
  } else if (event.key === "Enter") {
    event.preventDefault();

    if ($("player").classList.contains("open")) {
      if (
        $("player").contains(document.activeElement) &&
        document.activeElement.tagName === "BUTTON"
      ) {
        document.activeElement.click();
      } else {
        togglePlayback();
      }
    } else {
      refreshFocus();

      if (focusList[selected]) {
        focusList[selected].click();
      }
    }
  } else if (
    event.key === "Escape" ||
    event.key === "Backspace"
  ) {
    event.preventDefault();

    if ($("player").classList.contains("open")) {
      closePlayer();
    } else {
      home();
    }
  }
});

document.addEventListener("wheel",event => {
  if (Date.now() - lastWheel < 180) return;

  lastWheel = Date.now();
  move(event.deltaY > 0 ? 1 : -1);
},{passive:true});

$("search").oninput = render;

function updateClock() {
  $("clock").textContent =
    new Intl.DateTimeFormat("tr-TR",{
      timeZone:"Europe/Istanbul",
      day:"numeric",
      month:"long",
      hour:"2-digit",
      minute:"2-digit"
    }).format(new Date());
}

updateClock();
setInterval(updateClock,60000);
render();
</script>
</body>
</html>
