
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ŞEHZADE MEDIA</title>
<style>
:root{--gold:#e9c57d;--blue:#39aaff}
*{box-sizing:border-box}
body{margin:0;background:#071525;color:white;font-family:Arial,sans-serif}
header{min-height:180px;padding:22px 3%;background:linear-gradient(90deg,#061322cc,#06132233),url('sehzade_istanbul_banner.jpg') center/cover;border-bottom:2px solid #a88b59}
.logo{font-size:clamp(25px,4vw,42px);font-weight:bold;color:var(--gold);text-shadow:0 3px 10px black}
.logo span{color:white;font-weight:normal}
.sub{letter-spacing:2px;font-size:12px;margin-top:10px}
#clock{margin-top:16px;font-size:17px}
main{padding:16px 3% 95px}
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
button{color:white;cursor:pointer;font-family:inherit}
.menu,.tile{background:linear-gradient(140deg,#193651,#091727);border:1px solid #486883;border-radius:12px}
.menu{min-height:110px;padding:10px}
.menu .emoji{font-size:36px;display:block;margin-bottom:9px}
.menu strong{font-size:17px}
.menu.active,.selected{outline:3px solid var(--blue)!important;box-shadow:0 0 16px #279eff88}
h2{font-size:21px;margin:25px 0 12px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tile{min-height:105px;padding:12px 5px;position:relative;text-align:center}
.tile .emoji{display:block;font-size:30px;margin-bottom:10px}
.tile strong{font-size:15px}
.star{position:absolute;right:5px;top:4px;border:0;background:transparent;color:var(--gold);font-size:22px}
.bar{display:flex;justify-content:space-between;gap:10px;align-items:center}
input{background:#102a42;color:white;border:1px solid #6588a3;border-radius:8px;padding:12px;width:220px;max-width:45vw}
footer{position:fixed;bottom:0;left:0;right:0;background:#061322f5;border-top:1px solid #5c7890;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.action{background:#123a5b;border:1px solid #5b9bd0;border-radius:12px;padding:13px}
#mic{flex:1;max-width:500px}
#status{font-size:12px;color:#b4d2e7}
.note{font-size:12px;color:#adc2d5;line-height:1.5;margin:24px 0}
@media(max-width:950px){nav{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:550px){header{min-height:130px}.menu{min-height:85px}.menu .emoji{font-size:26px}.grid{grid-template-columns:repeat(2,1fr)}#status{display:none}}
</style>
</head>
<style>
#sehzadePlayer{
  display:none;
  position:fixed;
  inset:0;
  z-index:99999;
  background:#061322;
  color:white;
  padding:18px;
  font-family:Arial,sans-serif;
}
#sehzadePlayer .playerTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
#sehzadePlayer video{
  width:100%;
  max-height:65vh;
  background:black;
  border:1px solid #d7b678;
  border-radius:12px;
}
#sehzadePlayer .playerButtons{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:16px;
}
#sehzadePlayer button{
  padding:14px 20px;
  background:#163a5a;
  color:white;
  border:1px solid #8bbce3;
  border-radius:10px;
  font-size:16px;
}
#sehzadePlayer button:focus{
  outline:3px solid #39aaff;
}
</style>

<div id="sehzadePlayer">
  <div class="playerTop">
    <h2 id="playerTitle">Canlı TV</h2>
    <button onclick="closePlayer()">✕ Kapat</button>
  </div>

  <video id="liveVideo"
         controls
         playsinline
         preload="none">
  </video>

  <p id="playerMessage">
    Yayın hazırlanıyor...
  </p>

  <div class="playerButtons">
    <button onclick="changeChannel(-1)">
      ⏮ Önceki Kanal
    </button>
    <button onclick="togglePlayback()">
      ⏯ Oynat / Duraklat
    </button>
    <button onclick="changeChannel(1)">
      Sonraki Kanal ⏭
    </button>
    <button onclick="fullScreenPlayer()">
      ⛶ Tam Ekran
    </button>
  </div>
</div>

<script>
const SEHZADE_STREAMS = {
  "TRT 1": "",
  "TRT Spor": "",
  "ATV": "",
  "Kanal D": "",
  "Show TV": "",
  "Star TV": "",
  "NOW": "",
  "TV8": "",
  "TRT Haber": "",
  "A Haber": "",
  "NTV": "",
  "TRT Belgesel": ""
};

let activeChannelIndex = 0;
let playerOpen = false;

function openPlayer(channelName){
  const channels = Object.keys(SEHZADE_STREAMS);
  const index = channels.indexOf(channelName);

  if(index < 0) return;

  activeChannelIndex = index;
  playerOpen = true;

  document.getElementById("sehzadePlayer")
    .style.display = "block";

  loadChannel();
}

function loadChannel(){
  const channels = Object.keys(SEHZADE_STREAMS);
  const name = channels[activeChannelIndex];
  const url = SEHZADE_STREAMS[name];
  const video = document.getElementById("liveVideo");
  const message = document.getElementById("playerMessage");

  video.pause();
  video.removeAttribute("src");
  video.load();

  document.getElementById("playerTitle")
    .textContent = "📺 " + name;

  if(!url){
    message.textContent =
      "Bu kanalın doğrudan yayın bağlantısı henüz eklenmedi.";
    return;
  }

  video.src = url;
  message.textContent = "Yayın yükleniyor...";

  video.play().then(()=>{
    message.textContent = "Canlı yayın oynatılıyor";
  }).catch(()=>{
    message.textContent =
      "Yayın otomatik başlamadı veya tarayıcı desteklemiyor.";
  });
}

function changeChannel(direction){
  const count = Object.keys(SEHZADE_STREAMS).length;
  activeChannelIndex =
    (activeChannelIndex + direction + count) % count;
  loadChannel();
}

function togglePlayback(){
  const video = document.getElementById("liveVideo");
  if(video.paused) video.play().catch(()=>{});
  else video.pause();
}

function fullScreenPlayer(){
  const video = document.getElementById("liveVideo");
  if(video.requestFullscreen) video.requestFullscreen();
  else if(video.webkitEnterFullscreen)
    video.webkitEnterFullscreen();
}

function closePlayer(){
  const video = document.getElementById("liveVideo");
  video.pause();
  video.removeAttribute("src");
  video.load();

  document.getElementById("sehzadePlayer")
    .style.display = "none";
  playerOpen = false;
}

/* Mevcut kanal seçimlerini dahili oynatıcıya bağla */
if(typeof openItem === "function"){
  const originalOpenItem = openItem;

  openItem = function(item){
    if(item && Object.prototype.hasOwnProperty.call(
      SEHZADE_STREAMS,item[0]
    )){
      openPlayer(item[0]);
      return;
    }
    return originalOpenItem(item);
  };
}
</script>

<body>
<header>
<div class="logo">♛ ŞEHZADE <span>MEDIA</span></div>
<div class="sub">TV · RADYO · YOUTUBE · ÇOCUK · FAVORİLER</div>
<div id="clock"></div>
</header>
<main>
<nav id="nav"></nav>
<div class="bar">
<h2 id="heading">Popüler TV Kanalları</h2>
<input id="search" placeholder="İçerik ara">
</div>
<div class="grid" id="cards"></div>
<div id="extra"></div>
<p class="note">Yayınlar resmî sağlayıcı sayfalarında açılır. Bazı içerikler APTV tarayıcısında oynatılamayabilir. Video yalnızca araç park hâlindeyken izlenmelidir.</p>
</main>
<footer>
<button class="action" onclick="home()">❮ Ana Menü</button>
<span id="status">Kumanda hazır</span>
<button class="action" id="mic" onclick="listen()">🎙️ Sesli Komut</button>
</footer>
<script>
const tv=[
["TRT 1","📺","https://www.trt1.com.tr/canli-izle"],
["TRT Spor","⚽","https://www.trtspor.com.tr/canli-yayin"],
["ATV","📺","https://www.atv.com.tr/canli-yayin"],
["Kanal D","📺","https://www.kanald.com.tr/canli-yayin"],
["Show TV","📺","https://www.showtv.com.tr/canli-yayin"],
["Star TV","⭐","https://www.startv.com.tr/canli-yayin"],
["NOW","📺","https://www.nowtv.com.tr/canli-yayin"],
["TV8","📺","https://www.tv8.com.tr/canli-yayin"],
["TRT Haber","📰","https://www.trthaber.com/canli-yayin-izle.html"],
["A Haber","📰","https://www.ahaber.com.tr/canli-yayin"],
["NTV","📰","https://www.ntv.com.tr/canli-yayin"],
["TRT Belgesel","🌍","https://www.trtbelgesel.com.tr/"]
];
const radio=[
["TRT FM","📻","https://www.trtdinle.com/"],
["TRT Radyo 1","🎙️","https://www.trtdinle.com/"],
["PowerTürk","🎵","https://www.powerapp.io/"],
["Metro FM","🎧","https://www.metrofm.com.tr/"],
["JoyTürk","🎶","https://www.joyturk.com.tr/"],
["Kral Pop","🎼","https://www.kralmuzik.com.tr/"],
["SlowTürk","💛","https://www.slowturk.com.tr/"],
["Radyo 7","📻","https://www.radyo7.com/"]
];
const yt=[
["YouTube","▶️","https://m.youtube.com/"],
["Eskişehirspor","⚽","yt:Eskişehirspor"],
["Spor Özetleri","🏆","yt:spor özetleri"],
["Müzik","🎸","yt:Türkçe müzik"],
["Belgeseller","🌍","yt:Türkçe belgesel"],
["Otomobil","🚘","yt:otomobil inceleme"]
];
const kids=[
["TRT Çocuk","🧸","https://www.trtcocuk.net.tr/"],
["YouTube Kids","🌈","https://www.youtubekids.com/"],
["Pepee","🐥","yt:Pepee"],
["Rafadan Tayfa","🎈","yt:Rafadan Tayfa"],
["Niloya","🌸","yt:Niloya"],
["Bilim ve Deney","🔬","yt:çocuk bilim deneyleri"]
];
const sections=[
["Canlı TV","📺",tv],
["Radyo","📻",radio],
["YouTube","▶️",yt],
["Çocuk","🧸",kids],
["Favoriler","⭐",[]],
["Sesli Komut","🎙️",[]]
];
const all=[...tv,...radio,...yt,...kids];
let page=0,selected=0,focusList=[],lastWheel=0;
let favorites=[];
try{favorites=JSON.parse(localStorage.getItem("sehzade_favorites")||"[]")}catch(e){}
const $=id=>document.getElementById(id);
function status(t){$("status").textContent=t}
function current(){
if(page===4)return all.filter(x=>favorites.includes(x[0]));
if(page===5)return [["Dinlemeyi Başlat","🎤","voice"],["Sesli Komut Yardımı","💬","help"]];
return sections[page][2];
}
function saveFav(name){
favorites=favorites.includes(name)?favorites.filter(x=>x!==name):[...favorites,name];
localStorage.setItem("sehzade_favorites",JSON.stringify(favorites));
render();
status("Favoriler güncellendi");
}
function makeCard(item){
const b=document.createElement("button");
b.className="tile";
b.dataset.focus="1";
b.innerHTML='<span class="emoji"></span><strong></strong>';
b.querySelector(".emoji").textContent=item[1];
b.querySelector("strong").textContent=item[0];
b.onclick=()=>openItem(item);
if(item[2]!=="voice"&&item[2]!=="help"){
const star=document.createElement("button");
star.className="star";
star.textContent=favorites.includes(item[0])?"★":"☆";
star.onclick=e=>{e.stopPropagation();saveFav(item[0])};
b.appendChild(star);
}
return b;
}
function drawCards(el,data){
el.replaceChildren(...data.map(makeCard));
}
function render(){
$("nav").replaceChildren();
sections.forEach((s,i)=>{
const b=document.createElement("button");
b.className="menu"+(i===page?" active":"");
b.dataset.focus="1";
b.innerHTML='<span class="emoji"></span><strong></strong>';
b.querySelector(".emoji").textContent=s[1];
b.querySelector("strong").textContent=s[0];
b.onclick=()=>go(i);
$("nav").appendChild(b);
});
$("heading").textContent=page===0?"📺 Popüler TV Kanalları":sections[page][1]+" "+sections[page][0];
const q=$("search").value.toLocaleLowerCase("tr-TR");
drawCards($("cards"),current().filter(x=>x[0].toLocaleLowerCase("tr-TR").includes(q)));
$("extra").replaceChildren();
if(page===0){
[["♫ Popüler Radyolar",radio.slice(0,6),1],
["▶ YouTube Önerileri",yt.slice(0,6),2],
["🧸 Çocuk İçerikleri",kids.slice(0,6),3],
["⭐ Favorilerim",all.filter(x=>favorites.includes(x[0])).slice(0,6),4]
].forEach(group=>{
const h=document.createElement("h2");
h.textContent=group[0];
const more=document.createElement("button");
more.className="action";
more.textContent="Tümünü Gör";
more.onclick=()=>go(group[2]);
h.append(" ",more);
const grid=document.createElement("div");
grid.className="grid";
drawCards(grid,group[1]);
$("extra").append(h,grid);
});
}
refresh();
}
function refresh(){
focusList=[...document.querySelectorAll('[data-focus="1"],footer button')];
selected=Math.min(selected,focusList.length-1);
focusList.forEach(x=>x.classList.remove("selected"));
if(focusList[selected])focusList[selected].classList.add("selected");
}
function go(i){
page=i;selected=i;$("search").value="";
render();status(sections[i][0]+" açıldı");
}
function home(){go(0)}
function move(n){
refresh();
selected=(selected+n+focusList.length)%focusList.length;
refresh();
focusList[selected].scrollIntoView({block:"nearest"});
status("Seçili: "+focusList[selected].textContent.trim().slice(0,35));
}
function openItem(item){
if(item[2]==="voice"){listen();return}
if(item[2]==="help"){
alert('Örnek: "TRT 1 aç", "Radyo aç", "YouTube’da Eskişehirspor ara", "Favorilerimi göster"');
return;
}
let url=item[2];
if(url.startsWith("yt:"))url="https://m.youtube.com/results?search_query="+encodeURIComponent(url.slice(3));
status(item[0]+" açılıyor");
const w=window.open(url,"_blank");
if(!w&&confirm("Yeni pencere açılamadı. Aynı sekmede açılsın mı?"))location.href=url;
}
function command(t){
const s=t.toLocaleLowerCase("tr-TR");
status("Duyulan: "+t);
if(s.includes("favori")){go(4);return}
if(s.includes("ana menü")||s.includes("başa dön")){home();return}
if(s.includes("youtube")&&s.includes("ara")){
const q=s.replace(/^.*?youtube(?:'da|’da|da)?\s*/,"").replace(/\s*ara$/,"");
openItem(["Arama","▶️","yt:"+q]);return;
}
const found=all.find(x=>s.includes(x[0].toLocaleLowerCase("tr-TR")));
if(found){openItem(found);return}
if(s.includes("radyo"))go(1);
else if(s.includes("youtube"))go(2);
else if(s.includes("çocuk"))go(3);
else if(s.includes("tv")||s.includes("televizyon"))go(0);
else status("Komut eşleşmedi: "+t);
}
function listen(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){alert("Bu tarayıcı konuşma tanımayı desteklemiyor olabilir.");return}
try{
const r=new SR();
r.lang="tr-TR";
r.onstart=()=>status("Dinliyorum...");
r.onresult=e=>command(e.results[0][0].transcript);
r.onerror=e=>status("Mikrofon hatası: "+e.error);
r.start();
}catch(e){alert("Mikrofon başlatılamadı: "+e.message)}
}
document.addEventListener("keydown",e=>{
if(document.activeElement===$("search"))return;
if(["ArrowDown","ArrowRight","ArrowUp","ArrowLeft"].includes(e.key)){
e.preventDefault();move(["ArrowDown","ArrowRight"].includes(e.key)?1:-1);
}else if(e.key==="Enter"){
e.preventDefault();refresh();focusList[selected]?.click();
}else if(e.key==="Escape"||e.key==="Backspace"){home()}
});
document.addEventListener("wheel",e=>{
if(Date.now()-lastWheel<180)return;
lastWheel=Date.now();
move(e.deltaY>0?1:-1);
},{passive:true});
$("search").oninput=render;
function clock(){
$("clock").textContent=new Intl.DateTimeFormat("tr-TR",{
timeZone:"Europe/Istanbul",
day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"
}).format(new Date());
}
clock();setInterval(clock,60000);
render();
</script>
</body>
</html>
