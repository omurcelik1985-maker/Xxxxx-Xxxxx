
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#07111f">
<title>ŞEHZADE MEDIA</title>

<style>
:root{
  --bg:#07111f;
  --panel:#111e30;
  --panel2:#18283d;
  --gold:#d9b878;
  --text:#f5f7fb;
  --muted:#a7b6c8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

header{
  position:relative;
  min-height:175px;
  padding:30px 42% 24px 4%;
  border-bottom:2px solid var(--gold);
  background:
    linear-gradient(90deg,rgba(4,14,27,.97),rgba(4,14,27,.45)),
    url("sehzade_istanbul_banner.jpg") center/cover;
}
.logo{
  font-size:clamp(28px,4vw,51px);
  font-weight:900;
  letter-spacing:2px;
  color:var(--gold);
  text-shadow:0 3px 12px #000;
  white-space:nowrap;
}
.logo span{color:white}
.subtitle{margin-top:12px;font-size:13px;letter-spacing:2px;color:#e2e9f2}

.live-panel{
  position:absolute;
  z-index:3;
  right:0;
  top:0;
  bottom:0;
  width:39%;
  background:#101b2b;
  box-shadow:-15px 0 30px rgba(6,13,25,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:18px;
}
.live-date{font-size:14px;color:#d5e0ed;text-transform:capitalize}
.live-time{
  margin-top:6px;
  font-size:clamp(25px,3.5vw,43px);
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.weather{
  border-left:1px solid #516078;
  padding-left:16px;
  min-width:95px;
  font-size:14px;
  line-height:1.8;
}
.weather-icon{font-size:26px}
.weather-temp{font-size:20px;font-weight:bold;color:var(--gold)}

main{padding:20px 4% 35px}
nav{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:3px 2px 16px;
  scrollbar-width:thin;
}
.menu{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
  padding:13px 17px;
  border:1px solid #33445a;
  border-radius:12px;
  background:#142239;
  color:white;
  font-weight:700;
}
.menu.active,.menu:hover,.menu.selected{
  background:var(--gold);
  color:#111827;
  border-color:var(--gold);
}
.menu .emoji{font-size:21px}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin:12px 0 20px;
}
h2{margin:0;font-size:25px}
#search{
  width:min(350px,100%);
  background:#17263a;
  color:white;
  border:1px solid #455771;
  padding:13px 16px;
  border-radius:12px;
}
#search::placeholder{color:#9aabc0}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:15px;
}
.tile{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:13px;
  min-height:145px;
  padding:20px 12px;
  background:linear-gradient(145deg,#1a2b42,#0f1b2c);
  border:1px solid #33445c;
  border-radius:17px;
  color:white;
  transition:.15s;
}
.tile:hover,.tile.selected{
  transform:translateY(-2px);
  border-color:var(--gold);
  background:#263a53;
}
.tile .emoji{font-size:42px}
.tile strong{font-size:16px;text-align:center}
.star{
  position:absolute;
  right:11px;
  top:8px;
  font-size:24px;
  color:var(--gold);
  padding:3px;
}

footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:17px 4%;
  border-top:1px solid #283b52;
  color:var(--muted);
  font-size:12px;
}
footer button{
  background:#233750;
  color:white;
  border:1px solid #4a5b72;
  border-radius:9px;
  padding:10px 13px;
}

.player{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  flex-direction:column;
  background:#020509;
}
.player.open{display:flex}
.player.cinema{background:black}

.player-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 20px;
  background:#101a29;
}
.player-top strong{font-size:19px}
.player-top button,.controls button{
  border:1px solid #53627a;
  border-radius:10px;
  background:#23354c;
  color:white;
  padding:11px 15px;
  font-weight:700;
}
.player-top button:hover,.controls button:hover{background:#415b79}
.video-area{
  position:relative;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
  background:black;
}
#video{
  display:block;
  width:100%;
  height:100%;
  max-height:100%;
  object-fit:contain;
  background:black;
}
.radio-display{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:16px;
  background:radial-gradient(circle,#203958,#060d19);
  pointer-events:none;
}
.radio-display.show{display:flex}
.radio-symbol{font-size:85px}
.radio-display strong{font-size:clamp(25px,5vw,47px);color:var(--gold)}
.radio-display small{font-size:17px;color:#b9c7d7}

.player-bottom{
  padding:12px 18px 17px;
  background:#101a29;
}
#message{
  text-align:center;
  color:#c8d6e7;
  font-size:13px;
  margin-bottom:12px;
  min-height:18px;
}
.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
}
.controls button{min-width:75px}
.controls .gold{background:#8d6b32}

@media(max-width:800px){
  header{padding:110px 15px 18px;min-height:220px}
  .live-panel{
    width:100%;
    height:96px;
    bottom:auto;
    gap:12px;
    padding:8px;
  }
  .live-date{font-size:12px}
  .live-time{font-size:27px}
  .weather{font-size:12px;padding-left:10px}
  .weather-temp{font-size:17px}
  .logo{font-size:30px}
  .subtitle{font-size:10px;letter-spacing:1px}
  main{padding:15px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{min-height:118px;padding:12px 5px}
  .tile .emoji{font-size:32px}
  .tile strong{font-size:13px}
  .player-top{padding:9px}
  .player-top strong{font-size:15px}
  .controls{gap:5px}
  .controls button{padding:9px 8px;min-width:56px;font-size:12px}
}
</style>
</head>

<body>

<header>
  <div class="logo">♛ ŞEHZADE <span>MEDIA</span></div>
  <div class="subtitle">CANLI TV · ÇOCUK · RADYO · HABER · SPOR</div>

  <div class="live-panel">
    <div>
      <div class="live-date" id="liveDate">Tarih yükleniyor</div>
      <div class="live-time" id="liveTime">--:--:--</div>
    </div>
    <div class="weather">
      <div><span class="weather-icon" id="weatherIcon">🌤️</span></div>
      <div>Eskişehir</div>
      <div class="weather-temp" id="weatherTemp">--°C</div>
    </div>
  </div>
</header>

<main>
  <nav id="nav"></nav>

  <div class="toolbar">
    <h2 id="heading">📺 Tüm TV</h2>
    <input id="search" type="search" placeholder="Kanal veya radyo ara...">
  </div>

  <div class="cards" id="cards"></div>
</main>

<footer>
  <span id="status">ŞEHZADE MEDIA · Hazır</span>
  <div>
    <button onclick="home()">⌂ Ana Sayfa</button>
    <button onclick="go(8)">★ Favoriler</button>
  </div>
</footer>

<div id="player" class="player">
  <div class="player-top">
    <strong id="playerTitle">Canlı Yayın</strong>
    <button onclick="closePlayer()">✕ Kapat</button>
  </div>

  <div class="video-area">
    <video id="video" controls playsinline webkit-playsinline autoplay></video>

    <div id="radioDisplay" class="radio-display">
      <div class="radio-symbol">📻</div>
      <strong id="radioName">Radyo</strong>
      <small>ŞEHZADE MEDIA · CANLI RADYO</small>
    </div>
  </div>

  <div class="player-bottom">
    <div id="message">Yayın hazırlanıyor...</div>
    <div class="controls">
      <button onclick="changeChannel(-1)">◀ Önceki</button>
      <button onclick="togglePlayback()">⏯ Oynat / Dur</button>
      <button onclick="changeChannel(1)">Sonraki ▶</button>
      <button onclick="retryChannel()">↻ Tekrar</button>
      <button class="gold" onclick="favoriteActive()">★ Favori</button>
      <button onclick="fullScreen()">⛶ Tam Ekran</button>
    </div>
  </div>
</div>

const MENU=[
['Tüm TV','📺'],
['Ulusal','🇹🇷'],
['Haber','📰'],
['Spor','⚽'],
['Ekonomi','💹'],
['Belgesel','🌍'],
['Çocuk','🧸'],
['Radyo','📻'],
['Favoriler','⭐'],
['YouTube','▶️']
];

let page=0;
let selected=0;
let focusList=[];
let activeIndex=0;
let activeRadio=false;
let hls=null;
let playbackId=0;
let retryTimer=null;
let lastWheel=0;
let favorites=[];

try{
  favorites=JSON.parse(
    localStorage.getItem('sehzade_favorites')||'[]'
  );
  if(!Array.isArray(favorites))favorites=[];
}catch(e){
  favorites=[];
}

function status(t){
  $('status').textContent=t;
}

function message(t){
  $('message').textContent=t;
}

function saveFavorites(){
  try{
    localStorage.setItem(
      'sehzade_favorites',
      JSON.stringify(favorites)
    );
  }catch(e){}
}

function toggleFavorite(name){
  if(favorites.includes(name)){
    favorites=favorites.filter(x=>x!==name);
  }else{
    favorites.push(name);
  }
  saveFavorites();
  render();
}

function items(){
  if(page===0)return TV;

  if(page>=1 && page<=6){
    return TV.filter(x=>x[2]===MENU[page][0]);
  }

  if(page===7)return RADIO;

  if(page===8){
    return [
      ...TV.filter(x=>favorites.includes(x[0])),
      ...RADIO.filter(x=>favorites.includes(x[0]))
    ];
  }

  return [
    ['YouTube Ana Sayfa','▶️'],
    ['Eskişehirspor','⚽'],
    ['Türkçe Müzik','🎵'],
    ['Belgesel','🌍'],
    ['Çocuk Şarkıları','🧸']
  ];
}

function render(){
  $('nav').replaceChildren();

  MENU.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='menu'+(page===i?' active':'');
    b.dataset.focus='1';

    const icon=document.createElement('span');
    icon.className='emoji';
    icon.textContent=m[1];

    const name=document.createElement('strong');
    name.textContent=m[0];

    b.append(icon,name);
    b.onclick=()=>go(i);
    $('nav').appendChild(b);
  });

  $('heading').textContent=
    MENU[page][1]+' '+MENU[page][0];

  $('cards').replaceChildren();

  const q=$('search').value.toLocaleLowerCase('tr-TR');

  const filtered=items().filter(x=>
    x[0].toLocaleLowerCase('tr-TR').includes(q)
  );

  filtered.forEach(item=>{
    const b=document.createElement('button');
    b.className='tile';
    b.dataset.focus='1';

    const icon=document.createElement('span');
    icon.className='emoji';
    icon.textContent=item[1];

    const name=document.createElement('strong');
    name.textContent=item[0];

    b.append(icon,name);
    b.onclick=()=>openItem(item);

    if(page!==9){
      const star=document.createElement('span');
      star.className='star';
      star.textContent=
        favorites.includes(item[0])?'★':'☆';

      star.onclick=e=>{
        e.stopPropagation();
        toggleFavorite(item[0]);
      };

      b.appendChild(star);
    }

    $('cards').appendChild(b);
  });

  if(filtered.length===0){
    const p=document.createElement('p');
    p.textContent='Bu bölümde sonuç bulunamadı.';
    p.style.color='#a7b6c8';
    $('cards').appendChild(p);
  }

  refreshFocus();
}

function refreshFocus(){
  focusList=[
    ...document.querySelectorAll(
      '#nav [data-focus],#cards [data-focus],footer button'
    )
  ];

  selected=Math.max(
    0,
    Math.min(selected,focusList.length-1)
  );

  focusList.forEach(x=>x.classList.remove('selected'));

  if(focusList[selected]){
    focusList[selected].classList.add('selected');
  }
}

function go(i){
  if($('player').classList.contains('open')){
    closePlayer();
  }

  page=i;
  selected=0;
  $('search').value='';
  render();
  status(MENU[i][0]+' bölümü açıldı');
}

function home(){
  go(0);
}

function openItem(item){

  if(page===9){
    const url=item[0]==='YouTube Ana Sayfa'
      ?'https://m.youtube.com/'
      :'https://m.youtube.com/results?search_query='+
        encodeURIComponent(item[0]);

    window.open(url,'_blank');
    return;
  }

  const tvIndex=TV.findIndex(x=>x[0]===item[0]);

  if(tvIndex>=0){
    activeRadio=false;
    activeIndex=tvIndex;
  }else{
    const radioIndex=RADIO.findIndex(
      x=>x[0]===item[0]
    );

    if(radioIndex<0)return;

    activeRadio=true;
    activeIndex=radioIndex;
  }

  $('player').classList.add('open');
  $('player').classList.add('cinema');

  loadChannel();

  const first=$('player').querySelector('button');
  if(first)first.focus();
}

function destroyStream(){
  playbackId++;

  clearTimeout(retryTimer);
  retryTimer=null;

  const v=$('video');

  v.pause();
  v.onplaying=null;
  v.onerror=null;
  v.onwaiting=null;

  if(hls){
    hls.destroy();
    hls=null;
  }

  v.removeAttribute('src');
  v.load();
}

function loadChannel(){
  destroyStream();

  const item=activeRadio
    ?RADIO[activeIndex]
    :TV[activeIndex];

  $('playerTitle').textContent=item[1]+' '+item[0];

  $('radioDisplay').classList.toggle(
    'show',
    activeRadio
  );

  $('radioName').textContent=item[0];

  const urls=activeRadio?item[2]:item[3];

  if(!urls || urls.length===0){
    message(
      'Bu kanalın doğrulanmış internet yayın adresi bulunmuyor.'
    );
    return;
  }

  playSources(urls,0,playbackId);
}

function playSources(urls,index,id){
  if(id!==playbackId)return;

  if(index>=urls.length){
    message(
      'Yayın açılamadı. Bağlantı geçersiz, engellenmiş '+
      'veya cihaz tarafından desteklenmiyor.'
    );
    return;
  }

  clearTimeout(retryTimer);
  retryTimer=null;

  if(hls){
    hls.destroy();
    hls=null;
  }

  const v=$('video');
  v.pause();
  v.removeAttribute('src');
  v.load();

  const item=activeRadio
    ?RADIO[activeIndex]
    :TV[activeIndex];

  const url=urls[index];

  message(
    item[0]+' bağlanıyor... ('+
    (index+1)+'/'+urls.length+')'
  );

  let started=false;
  let failed=false;

  function next(reason){
    if(id!==playbackId || failed)return;

    failed=true;
    clearTimeout(retryTimer);
    retryTimer=null;

    if(hls){
      hls.destroy();
      hls=null;
    }

    v.pause();
    v.removeAttribute('src');
    v.load();

    if(index+1<urls.length){
      message('Alternatif yayın deneniyor...');
      retryTimer=setTimeout(()=>{
        playSources(urls,index+1,id);
      },500);
    }else{
      message(
        item[0]+' açılamadı ('+reason+'). '+
        'Yayın bağlantısı kontrol edilmeli.'
      );
    }
  }

  v.onplaying=()=>{
    if(id!==playbackId)return;

    started=true;
    clearTimeout(retryTimer);
    retryTimer=null;

    message(
      (activeRadio?'📻 ':'🔴 ')+
      item[0]+' canlı yayında'
    );
  };

  v.onerror=()=>next('medya hatası');

  retryTimer=setTimeout(()=>{
    if(!started)next('bağlantı zaman aşımı');
  },14000);

  function start(){
    if(id!==playbackId)return;

    v.play().catch(err=>{
      if(id!==playbackId)return;

      if(err.name==='NotAllowedError'){
        clearTimeout(retryTimer);
        retryTimer=null;
        message(
          'Otomatik oynatma engellendi. '+
          'Oynat düğmesine basın.'
        );
      }else{
        next(err.name||'oynatma hatası');
      }
    });
  }

  const isHLS=
    url.includes('.m3u8') ||
    url.includes('playlist.m3u8');

  if(!isHLS){
    v.src=url;
    start();
    return;
  }

  if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=url;
    start();
    return;
  }

  if(window.Hls && Hls.isSupported()){
    hls=new Hls({
      enableWorker:true,
      maxBufferLength:20,
      manifestLoadingTimeOut:10000,
      fragLoadingTimeOut:10000
    });

    hls.attachMedia(v);

    hls.on(Hls.Events.MEDIA_ATTACHED,()=>{
      if(id===playbackId){
        hls.loadSource(url);
      }
    });

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      start();
    });

    hls.on(Hls.Events.ERROR,(event,data)=>{
      if(data.fatal){
        next(data.type||'HLS hatası');
      }
    });

  }else{
    next('HLS desteklenmiyor');
  }
}

function retryChannel(){
  loadChannel();
}

function changeChannel(direction){
  const list=activeRadio?RADIO:TV;

  activeIndex=
    (activeIndex+direction+list.length)%list.length;

  loadChannel();
}

function togglePlayback(){
  const v=$('video');

  if(v.paused){
    v.play().catch(err=>{
      message('Oynatma başarısız: '+err.name);
    });
  }else{
    v.pause();
    message('Yayın duraklatıldı.');
  }
}

function fullScreen(){
  const v=$('video');

  if(activeRadio){
    const panel=$('player');

    if(panel.requestFullscreen){
      panel.requestFullscreen().catch(()=>{});
    }
    return;
  }

  if(v.requestFullscreen){
    v.requestFullscreen().catch(()=>{
      $('player').classList.add('cinema');
    });
  }else if(v.webkitEnterFullscreen){
    try{
      v.webkitEnterFullscreen();
    }catch(e){}
  }else{
    $('player').classList.add('cinema');
  }
}

function favoriteActive(){
  const item=activeRadio
    ?RADIO[activeIndex]
    :TV[activeIndex];

  toggleFavorite(item[0]);
  message(item[0]+' favorileri güncellendi.');
}

function closePlayer(){
  destroyStream();

  $('player').classList.remove('open','cinema');

  if(document.fullscreenElement &&
     document.exitFullscreen){
    document.exitFullscreen().catch(()=>{});
  }

  render();
}

/* MERCEDES KUMANDA / KLAVYE KONTROLÜ */

function move(direction){
  refreshFocus();

  if(!focusList.length)return;

  selected=
    (selected+direction+focusList.length)%
    focusList.length;

  refreshFocus();

  if(focusList[selected]){
    focusList[selected].focus({
      preventScroll:true
    });

    focusList[selected].scrollIntoView({
      block:'nearest',
      inline:'nearest',
      behavior:'smooth'
    });
  }
}

document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;

  if(tag==='INPUT' && e.key!=='Escape'){
    return;
  }

  const playerOpen=$('player').classList.contains('open');

  if(playerOpen){
    if(e.key==='Escape' || e.key==='Backspace'){
      e.preventDefault();
      closePlayer();
    }else if(e.key==='ArrowRight'){
      e.preventDefault();
      changeChannel(1);
    }else if(e.key==='ArrowLeft'){
      e.preventDefault();
      changeChannel(-1);
    }else if(e.key===' '){
      e.preventDefault();
      togglePlayback();
    }
    return;
  }

  if(e.key==='ArrowRight' || e.key==='ArrowDown'){
    e.preventDefault();
    move(1);
  }else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){
    e.preventDefault();
    move(-1);
  }else if(e.key==='Enter'){
    e.preventDefault();
    if(focusList[selected]){
      focusList[selected].click();
    }
  }else if(e.key==='Escape' || e.key==='Backspace'){
    e.preventDefault();
    home();
  }
});

document.addEventListener('wheel',e=>{
  const now=Date.now();

  if(now-lastWheel<200)return;
  lastWheel=now;

  if($('player').classList.contains('open')){
    changeChannel(e.deltaY>0?1:-1);
  }else{
    move(e.deltaY>0?1:-1);
  }
},{passive:true});

/* SESLİ KOMUTLAR */

function listen(){
  const Recognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!Recognition){
    status('Bu tarayıcı sesli komutu desteklemiyor.');
    return;
  }

  const recognition=new Recognition();
  recognition.lang='tr-TR';
  recognition.interimResults=false;

  recognition.onresult=e=>{
    const command=
      e.results[0][0].transcript
        .toLocaleLowerCase('tr-TR');

    if(command.includes('radyo')){
      go(7);
    }else if(command.includes('çocuk')){
      go(6);
    }else if(command.includes('spor')){
      go(3);
    }else if(command.includes('haber')){
      go(2);
    }else if(command.includes('ana sayfa')){
      home();
    }else{
      const item=[...TV,...RADIO].find(x=>
        command.includes(
          x[0].toLocaleLowerCase('tr-TR')
        )
      );

      if(item)openItem(item);
    }
  };

  recognition.start();
}

function updateClock(){
  const now=new Date();

  $('liveDate').textContent=
    new Intl.DateTimeFormat('tr-TR',{
      timeZone:'Europe/Istanbul',
      weekday:'long',
      day:'numeric',
      month:'long',
      year:'numeric'
    }).format(now);

  $('liveTime').textContent=
    new Intl.DateTimeFormat('tr-TR',{
      timeZone:'Europe/Istanbul',
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit',
      hourCycle:'h23'
    }).format(now);
}

updateClock();
setInterval(updateClock,1000);

/* ESKİŞEHİR CANLI HAVA DURUMU */

async function updateWeather(){
  try{
    const url=
      'https://api.open-meteo.com/v1/forecast'+
      '?latitude=39.7767'+
      '&longitude=30.5206'+
      '&current=temperature_2m,weather_code'+
      '&timezone=Europe%2FIstanbul';

    const response=await fetch(url);

    if(!response.ok){
      throw new Error('Hava durumu alınamadı');
    }

    const data=await response.json();

    const temperature=data.current.temperature_2m;
    const code=data.current.weather_code;

    let icon='🌤️';

    if(code===0)icon='☀️';
    else if(code<=3)icon='⛅';
    else if(code<=48)icon='🌫️';
    else if(code<=67)icon='🌧️';
    else if(code<=77)icon='❄️';
    else icon='⛈️';

    $('weatherIcon').textContent=icon;
    $('weatherTemp').textContent=
      Math.round(temperature)+'°C';

  }catch(e){
    $('weatherTemp').textContent='--°C';
  }
}

updateWeather();
setInterval(updateWeather,15*60*1000);

$('search').addEventListener('input',render);

/* BAŞLAT */

render();
status(
  'ŞEHZADE MEDIA · '+
  TV.length+' TV kanalı · '+
  RADIO.length+' radyo'
);
</script>
