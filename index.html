
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071525">
<title>ŞEHZADE MEDIA</title>
<style>
:root{
  --bg:#071525;
  --panel:#102a43;
  --gold:#e9c57d;
  --blue:#38aaff;
  --muted:#b6c9db;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(145deg,#071525,#102b46,#06101c);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}
button,input{font-family:inherit}
button{cursor:pointer;color:white}
header{
  min-height:190px;
  padding:25px 4%;
  background:
    linear-gradient(90deg,#061322e8,#06132255),
    url("sehzade_istanbul_banner.jpg") center/cover;
  border-bottom:2px solid #a98b57;
}
.logo{
  color:var(--gold);
  font-size:clamp(27px,4vw,43px);
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 3px 12px #000;
}
.logo span{color:white;font-weight:400}
.subtitle{margin-top:10px;letter-spacing:2px;font-size:12px}
#clock{margin-top:22px;font-size:17px}
main{padding:18px 4% 105px}
nav{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px;
}
.menu,.tile,.control{
  background:linear-gradient(145deg,#193b59,#0b1c30);
  border:1px solid #52718b;
  border-radius:13px;
}
.menu{
  padding:15px 8px;
  min-height:108px;
  font-size:16px;
  font-weight:bold;
}
.emoji{display:block;font-size:31px;margin-bottom:9px}
.menu.active{border-color:var(--gold)}
.selected,button:focus-visible{
  outline:3px solid var(--blue)!important;
  box-shadow:0 0 16px #38aaff88;
}
h2{font-size:21px;margin:25px 0 14px}
.grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px;
}
.tile{
  position:relative;
  min-height:112px;
  padding:14px 8px;
  font-size:15px;
  font-weight:bold;
}
.star{
  position:absolute;
  top:3px;
  right:4px;
  background:transparent;
  border:0;
  color:var(--gold);
  font-size:22px;
  padding:3px;
}
.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
#search{
  background:#112c45;
  color:white;
  border:1px solid #6284a1;
  border-radius:9px;
  padding:12px;
  width:230px;
  max-width:43vw;
}
.control{
  padding:13px 17px;
  font-size:15px;
}
footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#061322f5;
  border-top:1px solid #587b96;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 4%;
  z-index:10;
}
#status{
  color:var(--muted);
  font-size:12px;
  text-align:center;
}
#player{
  display:none;
  position:fixed;
  inset:0;
  background:#061322;
  z-index:100;
  padding:16px 3%;
  overflow:auto;
}
#player.open{display:block}
.player-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
#video{
  display:block;
  width:100%;
  height:auto;
  max-height:66vh;
  aspect-ratio:16/9;
  background:#000;
  border:1px solid var(--gold);
  border-radius:12px;
}
#playerMessage{
  color:#c3d4e5;
  text-align:center;
  min-height:24px;
}
.player-actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
}
.notice{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
  margin-top:25px;
}
@media(max-width:950px){
  nav{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:550px){
  header{min-height:145px}
  .menu{min-height:85px}
  .menu .emoji{font-size:25px}
  .grid{grid-template-columns:repeat(2,1fr)}
  #status{display:none}
  .control{padding:12px 9px}
}
</style>
</head>
<body>

<header>
  <div class="logo">♛ ŞEHZADE <span>MEDIA</span></div>
  <div class="subtitle">TV · RADYO · YOUTUBE · ÇOCUK · FAVORİLER</div>
  <div id="clock"></div>
</header>

<main>
  <nav id="nav"></nav>
  <div class="bar">
    <h2 id="heading">Canlı TV</h2>
    <input id="search" placeholder="İçerik ara">
  </div>
  <div class="grid" id="cards"></div>
  <div id="extra"></div>
  <p class="notice">
    Yayınlar yalnızca sağlayıcıların izin verdiği akışlar
    üzerinden oynatılabilir. Araç ekranında video
    yalnızca park hâlindeyken kullanılmalıdır.
  </p>
</main>

<footer>
  <button class="control" onclick="home()">❮ Ana Menü</button>
  <span id="status">ŞEHZADE MEDIA hazır</span>
  <button class="control" onclick="listen()">🎙️ Sesli Komut</button>
</footer>

<div id="player">
  <div class="player-head">
    <h2 id="playerTitle">📺 Canlı TV</h2>
    <button class="control" onclick="closePlayer()">✕ Kapat</button>
  </div>
  <video id="video" controls playsinline preload="none"></video>
  <p id="playerMessage"></p>
  <div class="player-actions">
    <button class="control" onclick="changeChannel(-1)">⏮ Önceki</button>
    <button class="control" onclick="togglePlayback()">⏯ Oynat / Duraklat</button>
    <button class="control" onclick="changeChannel(1)">Sonraki ⏭</button>
    <button class="control" onclick="fullScreenPlayer()">⛶ Tam Ekran</button>
    <button class="control" onclick="favoriteActive()">☆ Favori</button>
  </div>
</div>

<script>
"use strict";

/*
  İzin verilen doğrudan yayın bağlantıları buraya eklenir.
  Boş bağlantı bulunan kanalda oynatıcı açılır,
  fakat canlı görüntü başlamaz.
*/
const STREAMS = {
  "TRT 1":"",
  "TRT Spor":"",
  "ATV":"",
  "Kanal D":"",
  "Show TV":"",
  "Star TV":"",
  "NOW":"",
  "TV8":"",
  "TRT Haber":"",
  "A Haber":"",
  "NTV":"",
  "TRT Belgesel":""
};

const tv = [
  ["TRT 1","📺","tv"],
  ["TRT Spor","⚽","tv"],
  ["ATV","📺","tv"],
  ["Kanal D","📺","tv"],
  ["Show TV","📺","tv"],
  ["Star TV","⭐","tv"],
  ["NOW","📺","tv"],
  ["TV8","📺","tv"],
  ["TRT Haber","📰","tv"],
  ["A Haber","📰","tv"],
  ["NTV","📰","tv"],
  ["TRT Belgesel","🌍","tv"]
];

const radio = [
  ["TRT FM","📻","radio"],
  ["TRT Radyo 1","🎙️","radio"],
  ["PowerTürk","🎵","radio"],
  ["Metro FM","🎧","radio"],
  ["JoyTürk","🎶","radio"],
  ["Kral Pop","🎼","radio"],
  ["SlowTürk","💛","radio"],
  ["Radyo 7","📻","radio"]
];

const youtube = [
  ["YouTube","▶️","https://m.youtube.com/"],
  ["Eskişehirspor","⚽","yt:Eskişehirspor"],
  ["Spor Özetleri","🏆","yt:spor özetleri"],
  ["Müzik","🎸","yt:Türkçe müzik"],
  ["Belgeseller","🌍","yt:Türkçe belgesel"],
  ["Otomobil","🚘","yt:otomobil inceleme"]
];

const kids = [
  ["TRT Çocuk","🧸","https://www.trtcocuk.net.tr/"],
  ["YouTube Kids","🌈","https://www.youtubekids.com/"],
  ["Pepee","🐥","yt:Pepee"],
  ["Rafadan Tayfa","🎈","yt:Rafadan Tayfa"],
  ["Niloya","🌸","yt:Niloya"],
  ["Bilim ve Deney","🔬","yt:çocuk bilim deneyleri"]
];

const sections = [
  ["Canlı TV","📺",tv],
  ["Radyo","📻",radio],
  ["YouTube","▶️",youtube],
  ["Çocuk","🧸",kids],
  ["Favoriler","⭐",[]],
  ["Sesli Komut","🎙️",[]]
];

const all = [...tv,...radio,...youtube,...kids];
const $ = id => document.getElementById(id);

let page = 0;
let selected = 0;
let focusList = [];
let lastWheel = 0;
let activeIndex = 0;
let activeType = "tv";
let recognition = null;
let favorites = [];

try {
  favorites = JSON.parse(
    localStorage.getItem("sehzade_favorites") || "[]"
  );
} catch(e) {
  favorites = [];
}

function status(message) {
  $("status").textContent = message;
}

function saveFavorites() {
  localStorage.setItem(
    "sehzade_favorites",
    JSON.stringify(favorites)
  );
}

function toggleFavorite(name) {
  if (favorites.includes(name)) {
    favorites = favorites.filter(x => x !== name);
  } else {
    favorites.push(name);
  }
  saveFavorites();
  render();
}

function currentItems() {
  if (page === 4) {
    return all.filter(x => favorites.includes(x[0]));
  }
  if (page === 5) {
    return [
      ["Dinlemeyi Başlat","🎤","voice"],
      ["Sesli Komut Yardımı","💬","help"]
    ];
  }
  return sections[page][2];
}

function makeCard(item) {
  const b = document.createElement("button");
  b.className = "tile";
  b.dataset.focus = "1";

  const emoji = document.createElement("span");
  emoji.className = "emoji";
  emoji.textContent = item[1];

  const name = document.createElement("strong");
  name.textContent = item[0];

  b.append(emoji,name);
  b.onclick = () => openItem(item);

  if (item[2] !== "voice" && item[2] !== "help") {
    const star = document.createElement("button");
    star.className = "star";
    star.textContent = favorites.includes(item[0]) ? "★" : "☆";
    star.onclick = e => {
      e.stopPropagation();
      toggleFavorite(item[0]);
    };
    b.appendChild(star);
  }
  return b;
}

function drawCards(container,items) {
  container.replaceChildren(...items.map(makeCard));
}

function render() {
  $("nav").replaceChildren();

  sections.forEach((section,i) => {
    const b = document.createElement("button");
    b.className = "menu" + (i === page ? " active" : "");
    b.dataset.focus = "1";
    b.innerHTML =
      '<span class="emoji"></span><strong></strong>';
    b.querySelector(".emoji").textContent = section[1];
    b.querySelector("strong").textContent = section[0];
    b.onclick = () => go(i);
    $("nav").appendChild(b);
  });

  $("heading").textContent =
    sections[page][1] + " " + sections[page][0];

  const query = $("search").value.toLocaleLowerCase("tr-TR");

  drawCards(
    $("cards"),
    currentItems().filter(x =>
      x[0].toLocaleLowerCase("tr-TR").includes(query)
    )
  );

  $("extra").replaceChildren();

  if (page === 0) {
    [
      ["📻 Popüler Radyolar",radio.slice(0,6),1],
      ["▶️ YouTube",youtube.slice(0,6),2],
      ["🧸 Çocuk İçerikleri",kids.slice(0,6),3]
    ].forEach(group => {
      const h = document.createElement("h2");
      h.textContent = group[0];

      const more = document.createElement("button");
      more.className = "control";
      more.textContent = "Tümünü Gör";
      more.onclick = () => go(group[2]);
      h.append(" ",more);

      const grid = document.createElement("div");
      grid.className = "grid";
      drawCards(grid,group[1]);

      $("extra").append(h,grid);
    });
  }

  refreshFocus();
}

function refreshFocus() {
  focusList = [
    ...document.querySelectorAll(
      '#nav [data-focus="1"],' +
      '#cards [data-focus="1"],' +
      '#extra [data-focus="1"],' +
      'footer button'
    )
  ];

  selected = Math.max(
    0,
    Math.min(selected,focusList.length-1)
  );

  focusList.forEach(el =>
    el.classList.remove("selected")
  );

  if (focusList[selected]) {
    focusList[selected].classList.add("selected");
  }
}

function go(index) {
  page = index;
  selected = index;
  $("search").value = "";
  render();
  status(sections[index][0] + " açıldı");
}

function home() {
  closePlayer();
  go(0);
}

function move(direction) {
  if ($("player").classList.contains("open")) {
    const controls = [
      ...$("player").querySelectorAll("button")
    ];
    if (!controls.length) return;

    const focused = document.activeElement;
    let index = controls.indexOf(focused);
    index = (index + direction + controls.length)
      % controls.length;
    controls[index].focus();
    return;
  }

  refreshFocus();
  if (!focusList.length) return;

  selected =
    (selected + direction + focusList.length)
    % focusList.length;

  refreshFocus();
  focusList[selected].scrollIntoView({
    block:"nearest"
  });
}

function openItem(item) {
  if (!item) return;

  if (item[2] === "tv") {
    openPlayer(item[0],"tv");
    return;
  }

  if (item[2] === "radio") {
    openPlayer(item[0],"radio");
    return;
  }

  if (item[2] === "voice") {
    listen();
    return;
  }

  if (item[2] === "help") {
    alert(
      'Örnek: "TRT 1 aç", "Radyo aç", ' +
      '"YouTube aç", "Favorilerimi göster"'
    );
    return;
  }

  // YouTube ve diğer web içerikleri
  let url = item[2];

  if (url.startsWith("yt:")) {
    url = "https://m.youtube.com/results?search_query="
      + encodeURIComponent(url.slice(3));
  }

  const win = window.open(url,"_blank");
  if (!win) status("Tarayıcı yeni pencereyi engelledi.");
}

function openPlayer(name,type) {
  activeType = type;

  const list = type === "radio" ? radio : tv;
  const index = list.findIndex(x => x[0] === name);

  if (index < 0) return;

  activeIndex = index;
  $("player").classList.add("open");

  loadChannel();
  $("player").querySelector("button").focus();
}

function loadChannel() {
  const list = activeType === "radio" ? radio : tv;
  const item = list[activeIndex];

  const video = $("video");
  video.pause();
  video.removeAttribute("src");
  video.load();

  $("playerTitle").textContent =
    item[1] + " " + item[0];

  if (activeType === "radio") {
    $("playerMessage").textContent =
      "Radyo oynatıcısı hazır. Doğrudan ses akışı " +
      "henüz tanımlanmadı.";
    return;
  }

  const url = STREAMS[item[0]];

  if (!url) {
    $("playerMessage").textContent =
      "Bu kanalın doğrudan canlı yayın bağlantısı " +
      "henüz eklenmedi.";
    return;
  }

  video.src = url;
  $("playerMessage").textContent = "Yayın yükleniyor...";

  video.play().then(() => {
    $("playerMessage").textContent =
      "Canlı yayın oynatılıyor.";
  }).catch(() => {
    $("playerMessage").textContent =
      "Yayın bu tarayıcıda başlatılamadı.";
  });
}

function changeChannel(direction) {
  const list = activeType === "radio" ? radio : tv;

  activeIndex =
    (activeIndex + direction + list.length)
    % list.length;

  loadChannel();
}

function togglePlayback() {
  const video = $("video");

  if (video.paused) {
    video.play().catch(() => {
      $("playerMessage").textContent =
        "Oynatılabilir yayın bulunamadı.";
    });
  } else {
    video.pause();
  }
}

function fullScreenPlayer() {
  const video = $("video");

  if (video.requestFullscreen) {
    video.requestFullscreen().catch(() => {});
  } else if (video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();
  }
}

function favoriteActive() {
  const list = activeType === "radio" ? radio : tv;
  toggleFavorite(list[activeIndex][0]);
}

function closePlayer() {
  const video = $("video");
  video.pause();
  video.removeAttribute("src");
  video.load();

  $("player").classList.remove("open");
}

function command(text) {
  const s = text.toLocaleLowerCase("tr-TR");
  status("Duyulan: " + text);

  if (s.includes("favori")) {
    go(4);
    return;
  }

  if (
    s.includes("ana menü") ||
    s.includes("başa dön")
  ) {
    home();
    return;
  }

  const channel = [...tv,...radio].find(x =>
    s.includes(x[0].toLocaleLowerCase("tr-TR"))
  );

  if (channel) {
    openItem(channel);
    return;
  }

  if (s.includes("radyo")) go(1);
  else if (s.includes("youtube")) go(2);
  else if (s.includes("çocuk")) go(3);
  else if (
    s.includes("tv") ||
    s.includes("televizyon")
  ) go(0);
  else status("Komut bulunamadı: " + text);
}

function listen() {
  const Speech =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Speech) {
    alert(
      "Bu tarayıcı Türkçe konuşma tanımayı " +
      "desteklemiyor olabilir."
    );
    return;
  }

  try {
    if (recognition) recognition.abort();

    recognition = new Speech();
    recognition.lang = "tr-TR";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () =>
      status("Dinliyorum...");

    recognition.onresult = e =>
      command(e.results[0][0].transcript);

    recognition.onerror = e =>
      status("Mikrofon hatası: " + e.error);

    recognition.start();
  } catch(e) {
    status("Mikrofon başlatılamadı.");
  }
}

document.addEventListener("keydown",e => {
  if (document.activeElement === $("search")) return;

  if (
    ["ArrowDown","ArrowRight","ArrowUp","ArrowLeft"]
      .includes(e.key)
  ) {
    e.preventDefault();
    move(
      ["ArrowDown","ArrowRight"].includes(e.key)
      ? 1 : -1
    );
  } else if (e.key === "Enter") {
    e.preventDefault();

    if ($("player").classList.contains("open")) {
      document.activeElement.click();
    } else {
      refreshFocus();
      if (focusList[selected]) {
        focusList[selected].click();
      }
    }
  } else if (
    e.key === "Escape" ||
    e.key === "Backspace"
  ) {
    if ($("player").classList.contains("open")) {
      closePlayer();
    } else {
      home();
    }
  }
});

document.addEventListener("wheel",e => {
  if (Date.now() - lastWheel < 180) return;
  lastWheel = Date.now();

  move(e.deltaY > 0 ? 1 : -1);
},{passive:true});

$("search").oninput = render;

function updateClock() {
  $("clock").textContent =
    new Intl.DateTimeFormat("tr-TR",{
      timeZone:"Europe/Istanbul",
      day:"numeric",
      month:"long",
      hour:"2-digit",
      minute:"2-digit"
    }).format(new Date());
}

updateClock();
setInterval(updateClock,60000);
render();
</script>
</body>
</html>
