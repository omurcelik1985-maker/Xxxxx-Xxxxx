
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071525">
<title>ŞEHZADE MEDIA</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
:root{--gold:#e9c57d;--blue:#39aaff}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#071525,#153a59);color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer;color:#fff}
header{padding:22px 4%;min-height:155px;background:linear-gradient(90deg,#061322ee,#06132255),url("sehzade_istanbul_banner.jpg") center/cover;border-bottom:2px solid #b99b65}
.logo{color:var(--gold);font-size:clamp(26px,4vw,42px);font-weight:900}.logo span{color:#fff;font-weight:400}
.sub{font-size:12px;letter-spacing:2px;margin-top:10px}#clock{margin-top:20px}
main{padding:18px 4% 100px}nav,.grid{display:grid;gap:12px}nav{grid-template-columns:repeat(5,minmax(0,1fr))}.grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.menu,.tile,.control{background:linear-gradient(145deg,#1b4567,#0b2036);border:1px solid #5a7d99;border-radius:12px}
.menu{padding:13px 5px;min-height:90px}.tile{position:relative;min-height:108px;padding:14px 7px}.emoji{display:block;font-size:28px;margin-bottom:8px}
.menu.active{border-color:var(--gold)}.selected,button:focus-visible{outline:3px solid var(--blue)!important;box-shadow:0 0 14px #39aaff88}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}h2{font-size:21px}
#search{background:#102d48;border:1px solid #6888a5;color:#fff;padding:11px;border-radius:9px;width:220px;max-width:43vw}
.star{position:absolute;right:5px;top:3px;font-size:23px;color:var(--gold)}.control{padding:12px 16px}
footer{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4%;background:#061322f5;border-top:1px solid #587b96}
#status{color:#bfd0df;font-size:12px;text-align:center}
#player{display:none;position:fixed;inset:0;z-index:100;padding:15px 3%;background:#061322;overflow:auto}#player.open{display:block}
.player-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
#video{display:block;width:100%;max-height:65vh;aspect-ratio:16/9;background:#000;border:1px solid var(--gold);border-radius:12px}
#message{min-height:35px;color:#c2d6e6;text-align:center}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.note{color:#b5c9d9;font-size:12px;line-height:1.6;margin-top:24px}
#player.cinema{padding:0;background:#000;overflow:hidden}
#player.cinema #video{position:absolute;inset:0;width:100%;height:100%;height:100dvh;max-height:none;aspect-ratio:auto;object-fit:contain;border:0;border-radius:0}
#player.cinema .player-head{position:absolute;z-index:3;top:0;left:0;right:0;padding:8px 14px;background:linear-gradient(#000b,transparent)}
#player.cinema .player-head h2{font-size:16px;margin:7px 0}
#player.cinema .actions{position:absolute;z-index:3;bottom:0;left:0;right:0;padding:9px 12px;background:linear-gradient(transparent,#000c)}
#player.cinema #message{position:absolute;z-index:3;left:10px;right:10px;bottom:60px;text-shadow:0 1px 3px #000;margin:0}
#player.cinema .control{padding:9px 11px}
@media(max-width:950px){nav{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:550px){.grid{grid-template-columns:repeat(2,1fr)}.menu{min-height:80px}#status{display:none}.control{padding:11px 8px}#player.cinema .actions{gap:5px}#player.cinema .control{font-size:12px;padding:8px}}
</style>
</head>
<body>
<header>
<div class="logo">♛ ŞEHZADE <span>MEDIA</span></div>
<div class="sub">CANLI TV · HABER · SPOR · BELGESEL · RADYO</div>
<div id="clock"></div>
</header>
<main>
<nav id="nav"></nav>
<div class="bar">
<h2 id="heading">📺 Tüm TV</h2>
<input id="search" placeholder="Kanal ara...">
</div>
<div class="grid" id="cards"></div>
<p class="note">Bazı yayınlar sağlayıcının erişim kuralları nedeniyle çalışmayabilir. Video yalnızca araç park hâlindeyken izlenmelidir.</p>
</main>
<footer>
<button class="control" onclick="home()">⌂ Ana Menü</button>
<span id="status">ŞEHZADE MEDIA hazır</span>
<button class="control" onclick="listen()">🎙️ Sesli Komut</button>
</footer>
<section id="player">
<div class="player-head">
<h2 id="playerTitle">Canlı TV</h2>
<button class="control" onclick="closePlayer()">✕ Kapat</button>
</div>
<video id="video" controls playsinline preload="none"></video>
<p id="message"></p>
<div class="actions">
<button class="control" onclick="changeChannel(-1)">⏮ Önceki</button>
<button class="control" onclick="togglePlayback()">⏯ Oynat</button>
<button class="control" onclick="retryChannel()">↻ Tekrar Dene</button>
<button class="control" onclick="changeChannel(1)">Sonraki ⏭</button>
<button class="control" onclick="fullScreen()">⛶ Tam Ekran</button>
<button class="control" onclick="favoriteActive()">☆ Favori</button>
</div>
</section>
<script>

const $=id=>document.getElementById(id);

['TRT Spor Yıldız','🏅','Spor',['https://tv-trtspor2.medya.trt.com.tr/master.m3u8']],
['TV8.5','⚽','Spor',['https://tv8.daioncdn.net/tv8bucuk/tv8bucuk_1080p.m3u8?app=tv8bucuk_web&ce=3']],
['A Spor','⚽','Spor',['https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/aspor/aspor_720p.m3u8']],
['HT Spor','⚽','Spor',['https://ciner-live.ercdn.net/htspor/htspor.m3u8']],
['Bloomberg HT','💹','Ekonomi',['https://ensonhaber-live.ercdn.net/bloomberght/bloomberght.m3u8']],
['A Para','💹','Ekonomi',['https://trkvz-live.ercdn.net/aparahd/aparahd.m3u8']],
['CNBC-e','💹','Ekonomi',['https://hnpsechtsc.turknet.ercdn.net/xpnvudnlsv/cnbc-e/cnbc-e.m3u8']],
['TRT Belgesel','🌍','Belgesel',['https://tv-trtbelgesel.medya.trt.com.tr/master_720.m3u8','https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8']],
['TLC','🌍','Belgesel',['https://dogus-live.daioncdn.net/tlc/tlc.m3u8']],
['DMAX','🌍','Belgesel',['https://dogus-live.daioncdn.net/dmax/dmax.m3u8']],
['TRT Çocuk','🧸','Çocuk',['https://tv-trtcocuk.medya.trt.com.tr/master.m3u8','https://tv-trtcocuk.live.trt.com.tr/master.m3u8']]
];

const RADIO=[
['TRT FM','📻'],['TRT Radyo 1','🎙️'],
['PowerTürk','🎵'],['Metro FM','🎧'],
['JoyTürk','🎶'],['Kral Pop','🎼'],
['SlowTürk','💛'],['Radyo 7','📻']
];

const MENU=[
['Tüm TV','📺'],['Ulusal','🇹🇷'],
['Haber','📰'],['Spor','⚽'],
['Ekonomi','💹'],['Belgesel','🌍'],
['Çocuk','🧸'],['Radyo','📻'],
['Favoriler','⭐'],['YouTube','▶️']
];

let page=0,selected=0,focusList=[];
let activeIndex=0,activeRadio=false,hls=null;
let attempt=0,playbackId=0,retryTimer=null,lastWheel=0;
let favorites=[];

try{
 favorites=JSON.parse(localStorage.getItem('sehzade_favorites')||'[]');
 if(!Array.isArray(favorites))favorites=[];
}catch(e){favorites=[]}

function status(t){$('status').textContent=t}
function message(t){$('message').textContent=t}

function saveFavorites(){
 try{
  localStorage.setItem('sehzade_favorites',JSON.stringify(favorites));
 }catch(e){}
}

function toggleFavorite(name){
 favorites=favorites.includes(name)
  ?favorites.filter(x=>x!==name)
  :[...favorites,name];
 saveFavorites();
 render();
}

function items(){
 if(page===0)return TV;
 if(page>=1&&page<=6)
  return TV.filter(x=>x[2]===MENU[page][0]);
 if(page===7)return RADIO;
 if(page===8)return [
  ...TV.filter(x=>favorites.includes(x[0])),
  ...RADIO.filter(x=>favorites.includes(x[0]))
 ];
 return [
  ['YouTube','▶️'],['Eskişehirspor','⚽'],
  ['Türkçe Müzik','🎵'],['Belgesel','🌍'],
  ['Çocuk Şarkıları','🧸']
 ];
}

function render(){
 $('nav').replaceChildren();

 MENU.forEach((m,i)=>{
  const b=document.createElement('button');
  b.className='menu'+(page===i?' active':'');
  b.dataset.focus='1';

  const icon=document.createElement('span');
  icon.className='emoji';
  icon.textContent=m[1];

  const name=document.createElement('strong');
  name.textContent=m[0];

  b.append(icon,name);
  b.onclick=()=>go(i);
  $('nav').appendChild(b);
 });

 $('heading').textContent=MENU[page][1]+' '+MENU[page][0];
 $('cards').replaceChildren();

 const q=$('search').value.toLocaleLowerCase('tr-TR');

 items().filter(x=>
  x[0].toLocaleLowerCase('tr-TR').includes(q)
 ).forEach(item=>{
  const b=document.createElement('button');
  b.className='tile';
  b.dataset.focus='1';

  const icon=document.createElement('span');
  icon.className='emoji';
  icon.textContent=item[1];

  const name=document.createElement('strong');
  name.textContent=item[0];

  b.append(icon,name);
  b.onclick=()=>openItem(item);

  if(page!==9){
   const star=document.createElement('span');
   star.className='star';
   star.textContent=favorites.includes(item[0])?'★':'☆';
   star.onclick=e=>{
    e.stopPropagation();
    toggleFavorite(item[0]);
   };
   b.appendChild(star);
  }

  $('cards').appendChild(b);
 });

 refreshFocus();
}

function refreshFocus(){
 focusList=[...document.querySelectorAll(
  '#nav [data-focus],#cards [data-focus],footer button'
 )];

 selected=Math.max(0,Math.min(selected,focusList.length-1));
 focusList.forEach(x=>x.classList.remove('selected'));

 if(focusList[selected])
  focusList[selected].classList.add('selected');
}

function go(i){
 page=i;
 selected=i;
 $('search').value='';
 render();
 status(MENU[i][0]+' açıldı');
}

function home(){
 closePlayer();
 go(0);
}

function enterCinema(){
 const player=$('player');
 const video=$('video');

 player.classList.add('cinema');

 try{
  if(video.requestFullscreen){
   const p=video.requestFullscreen();
   if(p&&p.catch)p.catch(()=>{});
   return;
  }
  if(video.webkitEnterFullscreen){
   video.webkitEnterFullscreen();
   return;
  }
 }catch(e){}
}

function openItem(item){
 if(page===9){
  const url=item[0]==='YouTube'
   ?'https://m.youtube.com/'
   :'https://m.youtube.com/results?search_query='+
     encodeURIComponent(item[0]);
  window.open(url,'_blank');
  return;
 }

 const i=TV.findIndex(x=>x[0]===item[0]);

 if(i>=0){
  activeRadio=false;
  activeIndex=i;
 }else{
  const ri=RADIO.findIndex(x=>x[0]===item[0]);
  if(ri<0)return;
  activeRadio=true;
  activeIndex=ri;
 }

 $('player').classList.add('open');
 enterCinema();
 loadChannel();
 $('player').querySelector('button').focus();
}

function destroyStream(){
 playbackId++;
 clearTimeout(retryTimer);
 retryTimer=null;

 const v=$('video');
 v.pause();
 v.onerror=null;
 v.onplaying=null;
 v.onwaiting=null;

 if(hls){
  hls.destroy();
  hls=null;
 }

 v.removeAttribute('src');
 v.load();
}

function loadChannel(){
 destroyStream();
 attempt=0;

 const item=activeRadio?RADIO[activeIndex]:TV[activeIndex];
 $('playerTitle').textContent=item[1]+' '+item[0];

 if(activeRadio){
  message('Bu radyo için ses akışı henüz tanımlanmadı.');
  return;
 }

 if(!item[3].length){
  message('Bu kanal için kullanılabilir yayın bağlantısı yok.');
  return;
 }

 trySource();
}

function trySource(){
 const item=TV[activeIndex];
 const urls=item[3];

 if(attempt>=urls.length){
  message('Yayın açılamadı. Bağlantılar erişilemiyor veya tarayıcı desteklemiyor.');
  return;
 }

 const url=urls[attempt++];
 const id=playbackId;
 const v=$('video');

 message(item[0]+' bağlanıyor... Kaynak '+attempt+'/'+urls.length);

 let started=false,failed=false;

 function next(reason){
  if(id!==playbackId||started||failed)return;

  failed=true;
  clearTimeout(retryTimer);
  retryTimer=null;

  if(hls){
   hls.destroy();
   hls=null;
  }

  v.pause();
  v.removeAttribute('src');
  v.load();

  if(attempt<urls.length){
   message('Alternatif yayın deneniyor...');
   retryTimer=setTimeout(()=>{
    if(id===playbackId)trySource();
   },600);
  }else{
   message(
    'Yayın açılamadı ('+reason+'). '+
    'Bağlantı engellenmiş veya geçersiz olabilir.'
   );
  }
 }

 v.onplaying=()=>{
  if(id!==playbackId)return;

  started=true;
  clearTimeout(retryTimer);
  retryTimer=null;
  message('🔴 '+item[0]+' canlı yayın');
 };

 v.onerror=()=>next('video hatası');

 retryTimer=setTimeout(
  ()=>next('bağlantı zaman aşımı'),14000
 );

 function play(){
  if(id!==playbackId)return;

  v.play().catch(err=>{
   if(id!==playbackId)return;

   if(err.name==='NotAllowedError'){
    clearTimeout(retryTimer);
    retryTimer=null;
    message(
     'Otomatik oynatma engellendi. '+
     'Video üzerindeki oynat düğmesine basın.'
    );
   }else{
    next(err.name||'oynatma hatası');
   }
  });
 }

 if(v.canPlayType('application/vnd.apple.mpegurl')){
  v.src=url;
  play();
 }else if(window.Hls&&Hls.isSupported()){
  hls=new Hls({
   enableWorker:true,
   maxBufferLength:20,
   manifestLoadingTimeOut:10000,
   fragLoadingTimeOut:10000
  });

  hls.attachMedia(v);

  hls.on(Hls.Events.MEDIA_ATTACHED,()=>{
   if(id===playbackId)hls.loadSource(url);
  });

  hls.on(Hls.Events.MANIFEST_PARSED,play);

  hls.on(Hls.Events.ERROR,(event,data)=>{
   if(id===playbackId&&data.fatal)
    next(data.type||'HLS hatası');
  });
 }else{
  next('HLS desteklenmiyor');
 }
}

function retryChannel(){
 loadChannel();
}

function changeChannel(d){
 const list=activeRadio?RADIO:TV;
 activeIndex=(activeIndex+d+list.length)%list.length;
 loadChannel();
}

function togglePlayback(){
 const v=$('video');

 if(v.paused){
  v.play().catch(err=>{
   message('Oynatma başarısız: '+err.name);
  });
 }else{
  v.pause();
  message('Yayın duraklatıldı.');
 }
}

function fullScreen(){
 enterCinema();
}

function favoriteActive(){
 const item=activeRadio?RADIO[activeIndex]:TV[activeIndex];
 toggleFavorite(item[0]);
}

function closePlayer(){
 destroyStream();
 $('player').classList.remove('open','cinema');

 if(document.fullscreenElement&&document.exitFullscreen)
  document.exitFullscreen().catch(()=>{});

 if($('video').webkitExitFullscreen){
  try{
   $('video').webkitExitFullscreen();
  }catch(e){}
 }
}

function move(d){
 if($('player').classList.contains('open')){
  const buttons=[...$('player').querySelectorAll('button')];
  let i=buttons.indexOf(document.activeElement);
  i=(i+d+buttons.length)%buttons.length;
  buttons[i].focus();
  return;
 }

 refreshFocus();
 if(!focusList.length)return;

 selected=(selected+d+focusList.length)%focusList.length;
 refreshFocus();
 focusList[selected].scrollIntoView({block:'nearest'});
}

function command(t){
 const s=t.toLocaleLowerCase('tr-TR');
 status('Duyulan: '+t);

 if(s.includes('favori')){
  go(8);
  return;
 }

 if(s.includes('ana menü')){
  home();
  return;
 }

 const channel=TV.find(x=>
  s.includes(x[0].toLocaleLowerCase('tr-TR'))
 );

 if(channel){
  openItem(channel);
  return;
 }

 if(s.includes('haber'))go(2);
 else if(s.includes('spor'))go(3);
 else if(s.includes('radyo'))go(7);
 else if(s.includes('youtube'))go(9);
 else if(s.includes('çocuk'))go(6);
 else if(s.includes('televizyon'))go(0);
}

function listen(){
 const Speech=window.SpeechRecognition||
  window.webkitSpeechRecognition;

 if(!Speech){
  alert('Tarayıcı sesli komutu desteklemiyor.');
  return;
 }

 try{
  const r=new Speech();
  r.lang='tr-TR';
  r.onstart=()=>status('Dinliyorum...');
  r.onresult=e=>command(e.results[0][0].transcript);
  r.onerror=e=>status('Mikrofon hatası: '+e.error);
  r.start();
 }catch(e){
  status('Mikrofon başlatılamadı.');
 }
}

document.addEventListener('keydown',e=>{
 if(document.activeElement===$('search'))return;

 if([
  'ArrowDown','ArrowRight',
  'ArrowUp','ArrowLeft'
 ].includes(e.key)){
  e.preventDefault();
  move(
   ['ArrowDown','ArrowRight'].includes(e.key)?1:-1
  );
 }else if(e.key==='Enter'){
  e.preventDefault();

  if($('player').classList.contains('open')){
   if(
    $('player').contains(document.activeElement)&&
    document.activeElement.tagName==='BUTTON'
   ){
    document.activeElement.click();
   }else{
    togglePlayback();
   }
  }else{
   refreshFocus();
   if(focusList[selected])focusList[selected].click();
  }
 }else if(
  e.key==='Escape'||e.key==='Backspace'
 ){
  e.preventDefault();

  if($('player').classList.contains('open'))
   closePlayer();
  else home();
 }
});

document.addEventListener('wheel',e=>{
 if(Date.now()-lastWheel<180)return;
 lastWheel=Date.now();
 move(e.deltaY>0?1:-1);
},{passive:true});

$('search').oninput=render;

function clock(){
 $('clock').textContent=
  new Intl.DateTimeFormat('tr-TR',{
   timeZone:'Europe/Istanbul',
   day:'numeric',
   month:'long',
   hour:'2-digit',
   minute:'2-digit'
  }).format(new Date());
}

clock();
setInterval(clock,60000);
render();
</script>

<!-- SEHZADE MEDIA CANLI BILGI PANELI -->
<style>
header {
  position:relative;
  padding-right:39%;
  min-height:160px;
}

#liveInfo {
  position:absolute;
  right:0;
  top:0;
  width:39%;
  height:120px;
  z-index:5;
  background:#0a1625;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:12px 18px;
  color:white;
  box-shadow:-12px 0 20px #0a162588;
}

#liveDate {
  font-size:14px;
  line-height:1.7;
}

#liveTime {
  font-size:clamp(23px,3vw,38px);
  font-weight:700;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

#liveWeather {
  font-size:13px;
  border-left:1px solid #ffffff55;
  padding-left:14px;
  line-height:1.6;
}

#liveWeather .weatherIcon {
  font-size:24px;
}

@media(max-width:850px) {
  header {
    padding-right:4%;
    padding-top:118px;
    min-height:220px;
  }

  #liveInfo {
    width:100%;
    height:96px;
    gap:12px;
    padding:8px 10px;
  }

  #liveDate {font-size:12px}
  #liveTime {font-size:25px}
  #liveWeather {
    font-size:11px;
    padding-left:9px;
  }
}
</style>

<script>
(function() {
  const banner=document.querySelector("header");
  if(!banner || document.getElementById("liveInfo")) return;

  const info=document.createElement("div");
  info.id="liveInfo";

  info.innerHTML=`
    <div id="liveDate"></div>
    <div id="liveTime"></div>
    <div id="liveWeather">
      <span class="weatherIcon">☀️</span>
      Eskişehir
      <div id="liveTemp">Hava durumu yükleniyor</div>
    </div>
  `;

  banner.appendChild(info);

  function updateLiveTime() {
    const now=new Date();

    document.getElementById("liveDate").textContent=
      new Intl.DateTimeFormat("tr-TR",{
        timeZone:"Europe/Istanbul",
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }).format(now);

    document.getElementById("liveTime").textContent=
      new Intl.DateTimeFormat("tr-TR",{
        timeZone:"Europe/Istanbul",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hourCycle:"h23"
      }).format(now);
  }

  updateLiveTime();
  setInterval(updateLiveTime,1000);

  async function updateLiveWeather() {
    try {
      const response=await fetch(
        "https://api.open-meteo.com/v1/forecast"+
        "?latitude=39.7767"+
        "&longitude=30.5206"+
        "&current=temperature_2m,weather_code"+
        "&timezone=Europe%2FIstanbul"
      );

      if(!response.ok) throw new Error("Hava durumu hatası");

      const data=await response.json();
      const code=data.current.weather_code;

      const icon=
        code===0 ? "☀️" :
        code<=3 ? "⛅" :
        code<=48 ? "🌫️" :
        code<=67 ? "🌧️" :
        code<=77 ? "❄️" : "⛈️";

      info.querySelector(".weatherIcon").textContent=icon;

      document.getElementById("liveTemp").textContent=
        Math.round(data.current.temperature_2m)+"°C";

    } catch(e) {
      document.getElementById("liveTemp").textContent=
        "Hava bilgisi alınamadı";
    }
  }

  updateLiveWeather();
  setInterval(updateLiveWeather,15*60*1000);
})();
</script>
</body>
